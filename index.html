<style>
/* Layout: a green masthead band, then a newsroom page — lead story beside a "latest" rail, a filterable feed,
   country portals as a regional index, shorts strip, app band, about/contact. Article opens as its own view. */
/* Al Quds only for Arabic, digits, Latin letters and the punctuation it draws right: it maps : ! + [ ] { } < > # * & « »
   to Arabic-style or ornamental glyphs (": " as "؛", "[" as a calligraphic seal), so those fall back to the system font */
@font-face { font-family: "Al Quds"; src: url("assets/al-quds.otf") format("opentype"); font-display: swap;
  unicode-range: U+0020, U+0025, U+0027-0029, U+002C-0039, U+003F, U+0041-005A, U+0061-007A, U+00A0, U+00B0,
    U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+2010-2015, U+2212; }
:root {
  --brand: #004A49;        /* Erriwaya green */
  --brand-deep: #00302F;
  --on-brand: #F2F7F6;
  --breaking: #C8102E;     /* breaking-news red */
  --paper: #F4F7F6;
  --surface: #FFFFFF;
  --ink: #0F1E1D;
  --muted: #586A68;
  --line: #DAE3E1;
  --link: #00605E;
  --chip: #E6EEEC;
  --shadow: 0 1px 2px rgb(0 40 39 / .06), 0 6px 18px rgb(0 40 39 / .06);
  --f-display: "Al Quds", "Segoe UI", Tahoma, sans-serif;
  --f-body: "Al Quds", "Segoe UI", Tahoma, sans-serif;
  --wrap: 1180px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #071514; --surface: #0D201F; --ink: #E6EFED; --muted: #93A7A4; --line: #1D3432;
  --link: #6CC5C0; --chip: #15302E; --brand-deep: #002423; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #071514; --surface: #0D201F; --ink: #E6EFED; --muted: #93A7A4; --line: #1D3432;
  --link: #6CC5C0; --chip: #15302E; --brand-deep: #002423; --shadow: none; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html { scroll-behavior: smooth }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.75 var(--f-body); direction: rtl; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
a { color: inherit; text-decoration: none }
img { max-width: 100%; display: block }
button { font: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px }
.wrap { max-width: var(--wrap); margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0 }

/* ── masthead ── */
.top { background: var(--brand-deep); color: var(--on-brand); font-size: 13px }
.top .wrap { display: flex; justify-content: space-between; gap: 12px; padding-block: 6px; flex-wrap: wrap }
.socials { display: flex; gap: 8px; align-items: center }
.si { width: 1em; height: 1em; fill: currentColor }
.socials a { display: grid; place-items: center; border-radius: 50%; transition: background .2s, opacity .2s }
.top-soc a { width: 26px; height: 26px; font-size: 13px; opacity: .85 }
.top-soc a:hover { opacity: 1; background: rgb(255 255 255 / .14) }
.foot-soc { gap: 12px }
.foot-soc a { width: 42px; height: 42px; font-size: 18px; border: 1px solid rgb(255 255 255 / .3) }
.foot-soc a:hover { background: var(--on-brand); color: var(--brand-deep) }
.top .wrap { align-items: center }
.mast { background: var(--brand); color: var(--on-brand); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9 }
.mast .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px }
.brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0 }
.brand img { height: 46px; width: auto }
.brand b { font: 22px/1 var(--f-display); letter-spacing: 0; opacity: .95 }
.nav { display: flex; gap: 4px; margin-inline-start: auto; overflow-x: auto; scrollbar-width: none }
.nav::-webkit-scrollbar { display: none }
.sbtn { flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid rgb(255 255 255 / .35); background: none; color: inherit }
.sbtn .ic { width: 20px; height: 20px }
.sbtn:hover, .sbtn[aria-expanded="true"] { background: rgb(255 255 255 / .15) }
.nav a, .nav button { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; white-space: nowrap; font-size: 16px; background: none; border: 0; color: inherit }
.nav a:hover, .nav button:hover, .nav a[aria-current="page"], .nav button[aria-expanded="true"] { background: rgb(255 255 255 / .15) }
.nav .chev { width: 15px; height: 15px; transition: transform .25s }
.nav button[aria-expanded="true"] .chev { transform: rotate(180deg) }
.ic { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle }
.clock { display: inline-flex; align-items: center; gap: 6px } .clock .ic { width: 15px; height: 15px; opacity: .8 }
/* capitals board under the Nouakchott clock: each capsule shows a capital's time, slides to its weather, then to the next
   capital; a thin bar along the bottom shows how long until the next change */
.flaps { order: 3; flex-basis: 100%; display: flex; justify-content: center; gap: 10px; border-top: 1px solid rgb(255 255 255 / .08); padding-top: 7px; padding-bottom: 2px }
.flap { position: relative; width: 236px; height: 34px; flex-shrink: 0; border-radius: 999px; overflow: hidden;
  background: rgb(255 255 255 / .07); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .13) }
.flap:hover { background: rgb(255 255 255 / .12) }
.flap a { position: absolute; inset: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; color: #F2F7F6; white-space: nowrap }
.flap .c { font: 15px/1 var(--f-display); min-width: 60px; opacity: .9 }
.flap b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .03em }
.flap .n { font: 600 10px/1 "Segoe UI", Tahoma, Arial, sans-serif; unicode-bidi: isolate; direction: ltr; padding: 3px 5px; border-radius: 999px; background: rgb(255 255 255 / .12) }
.flap .s { opacity: .75; font-size: 13px; overflow: hidden; text-overflow: ellipsis }
.flap .k { margin-inline-start: auto; opacity: .45; display: inline-flex }
.flap .k .ic, .flap .wx-i { width: 18px; height: 18px }
.flap .wx-i { stroke: #F2F7F6 } .flap .wx-i.sun { stroke: #FFC93C } .flap .wx-i.moon { stroke: #C9D3EE } .flap .wx-i.rain { stroke: #7CC0FF } .flap .wx-i.storm { stroke: #C7A6F0 }
.flap .bar { position: absolute; inset-inline: 18px; bottom: 3px; height: 2px; border-radius: 2px; background: rgb(108 197 192 / .75);
  transform-origin: right; animation: flap-bar 3.5s linear both }
.flap a.out { animation: flap-out .28s ease-in forwards }
.flap a.in { animation: flap-in .34s .12s cubic-bezier(.2, .8, .3, 1) both }
@keyframes flap-out { to { transform: translateY(-10px); opacity: 0; filter: blur(2px) } }
@keyframes flap-in { from { transform: translateY(10px); opacity: 0; filter: blur(2px) } }
@keyframes flap-bar { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@media (prefers-reduced-motion: reduce) { .flap .bar { display: none } }
@media (max-width: 700px) { .flap { width: 100% } .flaps { padding-inline: 0 } }

/* portals dropdown: a chain of country links that unfolds one by one */
.search-panel { background: var(--brand-deep); border-top: 1px solid rgb(255 255 255 / .12); box-shadow: 0 14px 30px rgb(0 0 0 / .25) }
.search-panel .sbox { flex: 1; max-width: 820px; display: flex; align-items: center; gap: 10px; padding: 14px 0; margin: 0; background: none; border: 0; border-radius: 0; color: var(--on-brand) }
.search-panel .sbox .ic { width: 22px; height: 22px; flex-shrink: 0; opacity: .8 }
.search-panel .sbox input { flex: 1; width: auto; min-width: 0; font-size: 18px; padding: 10px 16px; border-radius: 999px; border: 1.5px solid rgb(255 255 255 / .35); background: rgb(255 255 255 / .08); color: var(--on-brand) }
.search-panel .sbox input::placeholder { color: rgb(255 255 255 / .6) }
.search-panel .sbox input:focus { outline: none; border-color: var(--on-brand) }
.search-panel .sbox .btn.solid { background: var(--on-brand); color: var(--brand-deep); border-color: var(--on-brand); flex-shrink: 0 }
mark { background: #F6D365; color: #13201F; border-radius: 3px; padding: 0 2px }
.by { color: var(--ink); font-weight: 600 }
.portals-panel { background: var(--brand-deep); border-top: 1px solid rgb(255 255 255 / .12); max-height: calc(100vh - 120px); overflow-y: auto; box-shadow: 0 14px 30px rgb(0 0 0 / .25) }
.portals-panel .wrap { display: grid; grid-template-columns: repeat(3, minmax(0, 280px)); justify-content: start; gap: 8px 48px; padding-block: 16px 20px }
.pgroup h4 { margin: 0 0 6px; font-size: 13px; font-weight: 400; opacity: .7; letter-spacing: .02em }
.pchain { list-style: none; margin: 0; padding: 0; position: relative }
.pchain::before { content: ""; position: absolute; inset-block: 18px; inset-inline-start: 20px; border-inline-start: 1.5px dashed rgb(255 255 255 / .3) }
.pchain a { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 8px; animation: link-in .32s both; animation-delay: calc(var(--i) * 45ms) }
.pchain a:hover, .pchain a[aria-current="page"] { background: rgb(255 255 255 / .1) }
.pchain .node { position: relative; width: 20px; height: 20px; border-radius: 50%; background: var(--brand); border: 1.5px solid rgb(255 255 255 / .55); display: grid; place-items: center; flex-shrink: 0; margin-inline-start: 5px }
.pchain .node .ic { width: 12px; height: 12px }
.pchain .ar { font-size: 19px }
.pchain .n { margin-inline-start: auto; font-size: 12px; background: rgb(255 255 255 / .14); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums }
@keyframes link-in { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
@media (max-width: 760px) { .portals-panel .wrap { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 700px) {
  .mast .wrap { flex-wrap: wrap; gap: 6px 12px }
  .brand img { height: 38px } .brand b { font-size: 18px }
  .sbtn { order: 1; margin-inline-start: auto; width: 38px; height: 38px }
  .nav { order: 2; flex-basis: 100% }
  .search-panel .sbox > .ic { display: none }
  .search-panel .sbox .btn.solid { padding-inline: 16px }
  .nav { margin-inline-start: 0; width: 100% }
}

/* ── news ticker ── */
.ticker { background: var(--surface, #fff); border-bottom: 1px solid var(--line); color: var(--ink) }
.ticker .wrap { display: flex; align-items: stretch; gap: 0; padding-block: 0 }
.ticker .lbl { display: inline-flex; align-items: center; gap: 6px; background: var(--brand); color: var(--on-brand); font: 17px/1 var(--f-display); padding: 10px 14px 8px; flex-shrink: 0 }
.ticker .lbl .ic { width: 15px; height: 15px }
.ticker .vp { position: relative; overflow: hidden; flex: 1; min-width: 0; display: flex; align-items: center;
  mask-image: linear-gradient(to left, transparent, #000 24px, #000 calc(100% - 24px), transparent); -webkit-mask-image: linear-gradient(to left, transparent, #000 24px, #000 calc(100% - 24px), transparent) }
.ticker .track { display: flex; width: max-content; animation: tick var(--dur, 60s) linear infinite }
.ticker .vp:hover .track, .ticker .vp:focus-within .track { animation-play-state: paused }
.ticker .track a { display: inline-flex; align-items: center; gap: 10px; padding-inline: 18px; white-space: nowrap; font-weight: 600; font-size: 15px }
.ticker .track a:hover { color: var(--link) }
.ticker .track a::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex-shrink: 0 }
.ticker .track a.br::before { background: var(--breaking) }
.ticker .track time { color: var(--muted); font-weight: 400; font-size: 13px }
@keyframes tick { from { transform: translateX(0) } to { transform: translateX(50%) } }
@media (max-width: 640px) { .ticker .lbl { font-size: 15px; padding: 9px 10px 7px } .ticker .track a { font-size: 14px; padding-inline: 14px } }
@media (prefers-reduced-motion: reduce) { .ticker .vp { overflow-x: auto } }
/* ── breaking ── */
.breaking { background: var(--breaking); color: #fff }
.breaking .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px }
.breaking .tag { display: inline-flex; align-items: center; font: 18px/1 var(--f-display); background: #fff; color: var(--breaking); padding: 5px 10px 3px; border-radius: 4px; flex-shrink: 0 }
.breaking .vp { position: relative; overflow: hidden; flex: 1; min-width: 0; display: flex; align-items: center;
  mask-image: linear-gradient(to left, transparent, #000 20px, #000 calc(100% - 20px), transparent); -webkit-mask-image: linear-gradient(to left, transparent, #000 20px, #000 calc(100% - 20px), transparent) }
.breaking .track { display: flex; width: max-content; animation: tick var(--dur, 30s) linear infinite }
.breaking .vp:hover .track, .breaking .vp:focus-within .track { animation-play-state: paused }
.breaking .track a { display: inline-flex; align-items: center; gap: 12px; padding-inline: 22px; white-space: nowrap; font-weight: 600; font-size: 16px }
.breaking .track a::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: rgb(255 255 255 / .7); flex-shrink: 0 }
.breaking .track a:hover { text-decoration: underline }
.breaking .track time { font-weight: 400; font-size: 13px; opacity: .8 }
@media (prefers-reduced-motion: reduce) { .breaking .vp { overflow-x: auto } }
.breaking .tag .ic { width: 14px; height: 14px; margin-inline-end: 2px }
.breaking .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; flex-shrink: 0 }
@keyframes pulse { 50% { opacity: .25 } }

main { padding-block: 24px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 44px }
main > * { min-width: 0 }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 6px }
.sec-h h2 { font: 28px/1.2 var(--f-display) }
.sec-h a, .sec-h span { color: var(--link); font-size: 14px; font-weight: 500 }

/* ── lead ── */
.lead { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 28px }
.lead-main { display: grid; gap: 14px; align-content: start }
.lead-main .media { aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: var(--chip); position: relative }
.lead-main .media img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s }
.lead-main:hover .media img { transform: scale(1.02) }
.lead-main h1 { font: 38px/1.35 var(--f-display) }
.lead-main p { color: var(--muted); margin: 0; font-size: 17px }
.rail { display: grid; gap: 0; align-content: start }
.rail h3 { font: 20px/1.2 var(--f-display); color: var(--muted); margin-bottom: 4px }
.rail a { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); align-items: center }
.rail a:last-child { border-bottom: 0 }
.rail .th { aspect-ratio: 16/10; border-radius: 4px; overflow: hidden; background: var(--chip); position: relative }
.rail .th img { width: 100%; height: 100%; object-fit: cover }
.rail strong { font-weight: 600; font-size: 15px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden }
@media (max-width: 860px) { .lead { grid-template-columns: minmax(0, 1fr) } .lead-main h1 { font-size: 30px } }

.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); align-items: center }
.meta .m { display: inline-flex; align-items: center; gap: 4px } .meta .ic { width: 14px; height: 14px }
.kicker { color: var(--link); font-weight: 600 }
.kicker.red { color: var(--breaking) }
.play { position: absolute; inset-inline-start: 10px; bottom: 10px; background: rgb(0 0 0 / .65); color: #fff; border-radius: 999px; font-size: 12px; padding: 3px 10px 3px 8px; display: flex; gap: 5px; align-items: center }
.play svg { width: 12px; height: 12px }
.badge-br { position: absolute; inset-inline-start: 10px; top: 10px; background: var(--breaking); color: #fff; font: 15px/1 var(--f-display); padding: 5px 9px 3px; border-radius: 3px }

/* ── filters + feed ── */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: thin }
.chips button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 14px; border-radius: 999px; white-space: nowrap; font-size: 14px }
.chips button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand) }
.feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 26px 22px }
.card { display: grid; gap: 10px; align-content: start }
.card .media { aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: var(--chip); position: relative }
.card .media img { width: 100%; height: 100%; object-fit: cover }
.card h3 { font-weight: 600; font-size: 17px; line-height: 1.6 }
.card:hover h3 { color: var(--link) }
.card p { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.more { display: flex; justify-content: center; margin-top: 22px }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--brand); background: transparent; color: var(--link); padding: 9px 22px; border-radius: 999px; font-weight: 600 }
.btn .ic { width: 18px; height: 18px }
.btn.solid { background: var(--brand); color: var(--on-brand) }
.empty { color: var(--muted); padding: 24px 0 }
.ph { width: 100%; height: 100%; display: grid; place-items: center; background: var(--brand); }
.media .ph img, .th .ph img { width: 30%; height: auto; object-fit: contain; opacity: .9 }

/* ── portals ── */
.regions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px }
.region h3 { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; margin-bottom: 8px }
.region ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line) }
.region li a { display: flex; align-items: baseline; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line) }
.region li a:hover { background: var(--chip) }
.region .ar { font: 22px/1.2 var(--f-display) }
.region .lat { font-size: 12px; color: var(--muted); direction: ltr; letter-spacing: .04em; text-transform: uppercase }
.region .n { margin-inline-start: auto; font-size: 13px; color: var(--link); font-variant-numeric: tabular-nums }
@media (max-width: 760px) { .regions { grid-template-columns: minmax(0, 1fr) } }

/* ── weather in the capitals (data.json → weather, Open-Meteo every 30 min) ── */
.wx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px }
.wx-c { display: grid; gap: 2px; justify-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; transition: border-color .2s }
.wx-c:hover { border-color: var(--link) }

  ["sn", "السنغال", "Sénégal", "الجوار", ["السنغال", "السنگال", "السينغال", "سنغالي", "داكار", "دكار", "سونكو", "فاي"]],

  ["gm", "غامبيا", "Gambie", "الجوار", ["غامبيا", "بانجول"]],

const reCache = new Map();
function matchesAny(text, kws) {
  return kws.some(k => {
    if (!k.startsWith("re:")) return text.includes(k);
    let r = reCache.get(k);
    if (!r) { try { r = new RegExp(k.slice(3), "u"); } catch { r = /$^/; } reCache.set(k, r); }
    return r.test(text);

}

const state = { articles: [], videos: [], site: {}, weather: {}, filter: "all", shown: 12 };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cleanTitle = t => (t || "").replace(/[#_]/g, " ").replace(/\s+/g, " ").trim() || "الرواية";
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },

};

// ── الوقت ──
function timeAgo(d) {
  if (!d) return "";
  const t = new Date(d); if (isNaN(t) || t.getFullYear() <= 2000) return "";
  const m = Math.floor((Date.now() - t) / 60000);
  const pl = (n, one, two, few) => n === 1 ? `منذ ${one}` : n === 2 ? `منذ ${two}` : n <= 10 ? `منذ ${n} ${few}` : `منذ ${n} ${one}`;
  if (m < 1) return "الآن";
  if (m < 60) return pl(m, "دقيقة", "دقيقتين", "دقائق");
  if (m < 1440) return pl(Math.floor(m / 60), "ساعة", "ساعتين", "ساعات");
  if (m < 43200) return pl(Math.floor(m / 1440), "يوم", "يومين", "أيام");
  return new Intl.DateTimeFormat("ar-u-nu-latn", { day: "numeric", month: "long", year: "numeric" }).format(t);
}
// العواصم: البوابة، المدينة، المنطقة الزمنية. المغرب عاد إلى توقيت غرينتش (والعيون معه)، وبيانات المتصفحات
// ما زالت تعطيه +1، فنثبّته على UTC هنا.
const CAPITALS = [["mr", "نواكشوط", "Africa/Nouakchott"], ["ma", "الرباط", "UTC"], ["dz", "الجزائر", "Africa/Algiers"],
  ["tn", "تونس", "Africa/Tunis"], ["ly", "طرابلس", "Africa/Tripoli"], ["eh", "العيون", "UTC"], ["sn", "داكار", "Africa/Dakar"],
  ["ml", "باماكو", "Africa/Bamako"], ["ne", "نيامي", "Africa/Niamey"], ["td", "انجامينا", "Africa/Ndjamena"], ["gm", "بانجول", "Africa/Banjul"]];
const capFmt = Object.fromEntries(CAPITALS.map(([c, , tz]) => [c, new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false })]));
const hourIn = (tz, now) => +new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "numeric", hourCycle: "h23" }).format(now);
function tickClock() {
  const now = new Date();
  const f = new Intl.DateTimeFormat("ar-u-nu-latn", { timeZone: "Africa/Nouakchott", weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  const nkc = wxCities().find(c => c.portal === "mr");
  $("#clock").textContent = "نواكشوط | " + f.format(now) + (nkc ? ` | ${nkc.temp}°` : "");
}

// ── لوحة العواصم: كل كبسولة تعرض عاصمة بوقتها، ثم تنتقل إلى طقسها، ثم إلى العاصمة التالية ──
const flaps = { boards: [], timer: 0, n: 0 };
function flapFace([code, city, tz], phase) {
  const now = new Date();
  if (phase === "time") {
    const d = (hourIn(tz, now) - hourIn("Africa/Nouakchott", now) + 36) % 24 - 12;   // الفارق عن نواكشوط
    return `<a href="#p-${code}" title="الساعة في ${city}"><span class="c">${city}</span><b>${capFmt[code].format(now)}</b>${d ? `<bdi class="n" dir="ltr">${d > 0 ? "+" : "−"}${Math.abs(d)}</bdi>` : ""}<span class="k">${ic("clock")}</span><i class="bar"></i></a>`;
  }
  const w = wxCities().find(c => c.portal === code), [icon, tone, label] = wxInfo(w.wmo, w.day);
  return `<a href="#p-${code}" title="الطقس في ${city}"><span class="c">${city}</span><svg class="wx-i ${tone}"><use href="#w-${icon}"/></svg><b>${w.temp}°</b><span class="s">${label}</span><i class="bar"></i></a>`;
}
// خطوات اللوحة: وقت كل عاصمة ثم طقسها (إن وُجد)
function flapSteps(i, n) {
  const hasWx = new Set(wxCities().map(c => c.portal));
  return CAPITALS.filter((_, k) => k % n === i).flatMap(c => hasWx.has(c[0]) ? [[c, "time"], [c, "wx"]] : [[c, "time"]]);
}
function flip(b) {
  const steps = flapSteps(b.i, flaps.n);
  b.k = (b.k + 1) % steps.length;
  const html = flapFace(...steps[b.k]);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { b.el.innerHTML = html; return; }
  // كل الوجوه السابقة تخرج، لا الأول فقط: إذا تتابعت قلبتان (مؤقّتات متراكمة بعد العودة إلى الصفحة) كان وجه يبقى عالقاً فوق الجديد
  const olds = [...b.el.children];
  b.el.insertAdjacentHTML("beforeend", html);
  const neu = b.el.lastElementChild;
  neu.classList.add("in"); olds.forEach(o => o.classList.add("out"));
  setTimeout(() => { olds.forEach(o => o.remove()); neu.classList.remove("in"); }, 520);
}
function buildFlaps() {
  const host = $("#flaps"), w = host.clientWidth || innerWidth;
  const n = Math.max(1, Math.min(5, Math.floor((w + 10) / 246)));
  if (n === flaps.n && flaps.boards.length) return;
  flaps.n = n;
  host.innerHTML = Array.from({ length: n }, () => `<div class="flap"></div>`).join("");
  flaps.boards = [...host.children].map((el, i) => ({ el, i, k: 0 }));
  flaps.boards.forEach(b => { b.el.innerHTML = flapFace(...flapSteps(b.i, n)[0]); });
  clearInterval(flaps.timer);
  flaps.timer = setInterval(() => { if (!document.hidden) flaps.boards.forEach((b, i) => setTimeout(() => flip(b), i * 180)); }, 3500);
}
addEventListener("resize", () => { clearTimeout(flaps.rs); flaps.rs = setTimeout(buildFlaps, 200); });

// ── تطبيع البيانات ──
function normArticle(a) {
  return { kind: "a", id: a.id, title: a.title || "", body: a.body || "", category: a.category || "", writer: (a.writer || "").trim(),
    breaking: !!a.breaking, thumb: a.thumb || "", images: a.images || [], imageCount: a.imageCount ?? (a.images || []).length,
    portals: a.portals || [], dossier: a.dossier || "", date: a.createdAt || null };
}
function normVideo(v) {
  return { kind: "v", id: v.id, title: cleanTitle(v.title), rawTitle: v.title || "", short: !!v.short, views: v.views || 0, date: v.published || null };
}
const text = it => (it.kind === "a" ? `${it.title} ${it.body}` : it.rawTitle).replace(/_/g, " ");
const titleOf = it => (it.kind === "a" ? it.title : it.rawTitle).replace(/_/g, " ");
const norm = t => String(t || "").replace(/[\u064B-\u0652\u0640]/g, "").replace(/[أإآ]/g, "ا").replace(/\s+/g, " ").trim();
// قسم المادة الوحيد (أو null لخبر عادي)
function sectionOf(it) {
  if (it._sec !== undefined) return it._sec;
  let sec = null;
  if (it.kind === "a" && it.category) sec = SECTIONS.find(x => x[3].some(n => norm(n) === norm(it.category))) || null;
  if (!sec) sec = SECTIONS.find(x => matchesAny(titleOf(it), x[4])) || null;
  return (it._sec = sec);
}
const inSection = (id, it) => sectionOf(it)?.[0] === id;
// شارة المادة: قسمها، وإلا تصنيفها في التطبيق، وإلا بوابتها الأولى
function kickerOf(it) {
  const sec = sectionOf(it); if (sec) return sec[1];
  if (it.kind === "a" && it.category) return it.category;
  return portalsOf(it)[0]?.[1] || "";
}
// البوابات: ما حدّده المحرر في التطبيق، وإلا ما يرد في العنوان (لا في النص كله، كي لا يتكرر الخبر في كل بوابة يُذكر فيها بلد عَرَضاً)
function portalsOf(it) {
  if (!it._por) it._por = it.kind === "a" && it.portals.length ? PORTALS.filter(p => it.portals.includes(p[0]))
    : PORTALS.filter(p => matchesAny(titleOf(it), p[4]));
  return it._por;
}
const inPortal = (p, it) => portalsOf(it).includes(p);
const isFreshBreaking = it => it.kind === "a" && it.breaking && it.date && Date.now() - new Date(it.date) < BREAKING_MS;
const thumbOf = it => it.kind === "v" ? `https://i.ytimg.com/vi/${it.id}/${it.short ? "oar2" : "hqdefault"}.jpg`
  : it.thumb ? `data:image/jpeg;base64,${it.thumb}` : (it.images[0] || "");
const bigThumbOf = it => it.kind === "v" && !it.short ? `https://i.ytimg.com/vi/${it.id}/maxresdefault.jpg` : thumbOf(it);
const ytUrl = v => v.short ? `https://www.youtube.com/shorts/${v.id}` : `https://www.youtube.com/watch?v=${v.id}`;
// حيث لا يمكن تشغيل يوتيوب داخل الصفحة، يفتح الفيديو مباشرة في يوتيوب
// خبر قديم من فهرس البحث (ليس بين آخر 60 خبراً): يُفتح في صفحته الثابتة
const hrefOf = it => it.kind === "a" ? (it.archived ? `news/${it.id}.html` : `#a-${it.id}`) : CAN_EMBED ? `#v-${it.id}` : ytUrl(it);
const tgt = it => it.kind === "v" && !CAN_EMBED ? ' target="_blank" rel="noopener"' : "";
const excerpt = b => { const t = b.replace(/\s+/g, " ").trim(); return t.length > 170 ? t.slice(0, 170) + "…" : t; };
const fmtViews = n => n >= 1e6 ? (n / 1e6).toFixed(1) + " مليون مشاهدة" : n >= 1e3 ? Math.round(n / 1e3) + " ألف مشاهدة" : n ? n + " مشاهدة" : "";

function feed() {

}

// ── عناصر العرض ──
const playIcon = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>`;
const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
function media(it, big) {
  const src = big ? bigThumbOf(it) : thumbOf(it);
  const img = src ? `<img src="${esc(src)}" alt="" loading="lazy" ${it.kind === "v" ? `data-alt="https://i.ytimg.com/vi/${it.id}/hqdefault.jpg"` : ""} onerror="imgErr(this)">`
    : `<div class="ph"><img src="${LOGO}" alt=""></div>`;
  return `<div class="media">${img}${it.kind === "v" ? `<span class="play">${playIcon}فيديو</span>` : ""}${isFreshBreaking(it) ? `<span class="badge-br">عاجل</span>` : ""}</div>`;
}
// صورة بديلة ثم شعار الرواية إن تعذّر تحميل الصورة
window.imgErr = el => {
  if (el.dataset.alt && el.src !== el.dataset.alt) { el.src = el.dataset.alt; delete el.dataset.alt; return; }
  el.onerror = null;
  const ph = document.createElement("div"); ph.className = "ph"; ph.innerHTML = `<img src="${LOGO}" alt="">`;
  el.replaceWith(ph);
};
function metaLine(it) {
  const c = kickerOf(it);

  const t = timeAgo(it.date);

  return `<div class="meta">${k}${w}${t ? `<span class="m"><svg class="ic"><use href="#i-clock"/></svg>${t}</span>` : ""}${it.kind === "v" && it.views ? `<span class="m"><svg class="ic"><use href="#i-eye"/></svg>${fmtViews(it.views)}</span>` : ""}</div>`;
}
function card(it) {

}

function renderTicker() {
  const items = feed().filter(it => it.date && Date.now() - new Date(it.date) < TICKER_MS).slice(0, 15);
  $("#ticker").hidden = !items.length;
  if (!items.length) return;
  const key = items.map(i => i.id + (isFreshBreaking(i) ? "!" : "")).join(",");
  const tr = $("#tickerTrack");
  if (tr.dataset.key === key) return;            // لا نعيد التشغيل إن لم يتغير شيء
  tr.dataset.key = key;
  const hm = d => d ? new Date(d).toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit", hour12: false, numberingSystem: "latn" }) : "";
  const one = items.map(it => `<a href="${hrefOf(it)}"${tgt(it)}${isFreshBreaking(it) ? ' class="br"' : ""}>${esc(it.title)}${it.date ? `<time>${hm(it.date)}</time>` : ""}</a>`).join("");
  tr.innerHTML = one + one.replace(/<a /g, '<a tabindex="-1" aria-hidden="true" ');
  requestAnimationFrame(() => tr.style.setProperty("--dur", Math.max(25, tr.scrollWidth / 2 / 55) + "s"));
}

// كل الأخبار العاجلة السارية (نصف ساعة) تتجول في الشريط الأحمر، الأحدث أولاً، حتى يُقرأ كل عنوان كاملاً
function renderBreaking() {
  const list = state.articles.filter(isFreshBreaking).sort((a, b) => new Date(b.date) - new Date(a.date));
  $("#breaking").hidden = !list.length;
  const tr = $("#breakingTrack");
  const key = list.map(i => i.id + i.title).join("|");
  if (!list.length) { tr.dataset.key = ""; tr.innerHTML = ""; return; }
  if (tr.dataset.key === key) return;            // لا نعيد التشغيل إن لم يتغير شيء
  tr.dataset.key = key;
  const hm = d => new Date(d).toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit", hour12: false, numberingSystem: "latn" });
  const one = list.map(it => `<a href="${hrefOf(it)}">${esc(it.title)}<time>${hm(it.date)}</time></a>`).join("");
  tr.innerHTML = one;
  requestAnimationFrame(() => {
    // نكرر المجموعة حتى تملأ عرض الشريط، ثم نضاعفها ليدور بلا انقطاع
    const k = Math.max(1, Math.ceil(tr.parentElement.clientWidth / Math.max(1, tr.scrollWidth)));
    const copy = one.replace(/<a /g, '<a tabindex="-1" aria-hidden="true" ');
    tr.innerHTML = one + copy.repeat(2 * k - 1);   // نصفان متطابقان، كل نصف يملأ الشريط
    tr.style.setProperty("--dur", Math.max(12, tr.scrollWidth / 2 / 45) + "s");
  });
}

// ── الطقس ──
// رموز WMO من Open-Meteo → [أيقونة، لون، وصف]
function wxInfo(c, day) {
  if (c <= 1) return [day ? "sun" : "moon", day ? "sun" : "moon", c ? (day ? "مشمس غالباً" : "صافٍ غالباً") : (day ? "مشمس" : "صافٍ")];
  if (c === 2) return [day ? "sun-cloud" : "moon-cloud", day ? "sun" : "moon", "غائم جزئياً"];
  if (c === 3) return ["cloud", "", "غائم"];
  if (c === 45 || c === 48) return ["fog", "", "ضباب"];
  if (c >= 51 && c <= 57) return ["rain", "rain", "رذاذ"];
  if (c === 61 || c === 80) return ["rain", "rain", "أمطار خفيفة"];
  if (c === 65 || c === 82) return ["rain", "rain", "أمطار غزيرة"];
  if ((c >= 61 && c <= 67) || c === 81) return ["rain", "rain", "أمطار"];
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return ["snow", "", "ثلوج"];
  if (c >= 95) return ["storm", "storm", c === 95 ? "عاصفة رعدية" : "عاصفة رعدية وبرَد"];
  return ["cloud", "", "—"];
}
// لا نعرض طقساً أقدم من 3 ساعات
function wxCities() {
  const w = state.weather || {};
  return w.cities && Date.now() - new Date(w.updated) < 3 * 3600e3 ? w.cities : [];
}
function weatherSection() {
  const cs = wxCities();
  if (!cs.length) return "";

// تطبيع عربي: بلا تشكيل ولا تطويل، والهمزات ألفاً، والتاء المربوطة هاءً، والألف المقصورة ياءً
const fold = t => String(t || "").toLowerCase().replace(/[\u064B-\u0652\u0670\u0640]/g, "")
  .replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/_/g, " ");
const search = { index: null, loading: null };
function loadIndex() {
  if (search.index) return Promise.resolve(search.index);
  return search.loading ||= fetch("search.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : [])
    .catch(() => []).then(list => (search.index = list.map(x => ({ kind: "a", archived: true, id: x.id, title: x.t || "",
      body: x.s || "", category: x.c || "", writer: x.w || "", breaking: false, thumb: "", images: x.i ? [x.i] : [],
      imageCount: x.i ? 1 : 0, portals: x.p || [], date: x.d || null }))));
}
function searchItems(q) {
  // «الأمطار» تطابق «أمطار» أيضاً: نحذف «ال» من أول الكلمة
  const words = fold(q).split(/\s+/).map(w => w.length > 4 && w.startsWith("ال") ? w.slice(2) : w).filter(w => w.length > 1 || /\d/.test(w));
  if (!words.length) return [];
  const live = new Set(state.articles.map(a => a.id));
  const pool = [...state.articles, ...(search.index || []).filter(a => !live.has(a.id)), ...state.videos];
  const scored = [];
  for (const it of pool) {
    const title = fold(titleOf(it)), all = title + " " + fold(it.kind === "a" ? `${it.body} ${it.writer} ${it.category}` : "");
    if (!words.every(w => all.includes(w))) continue;
    scored.push([words.filter(w => title.includes(w)).length, it]);
  }
  return scored.sort((x, y) => y[0] - x[0] || new Date(y[1].date || 0) - new Date(x[1].date || 0)).map(x => x[1]);
}
async function searchView(q) {
  const main = $("#main");
  main.innerHTML = `<p class="empty">جارٍ البحث…</p>`;
  await loadIndex();
  if (location.hash !== "#q=" + encodeURIComponent(q)) return;   // بحث أحدث بدأ في الأثناء
  const res = searchItems(q);
  main.innerHTML = listView(`نتائج البحث: ${q}`, res.length ? `${res.length} نتيجة` : "", res.slice(0, 60), true,
    `<p class="empty">لا نتائج لـ«${esc(q)}». جرّب كلمة أقصر أو اسم دولة أو مدينة.</p>`);
  window.scrollTo(0, 0);
}
function toggleSearch(open) {
  const panel = $("#searchPanel"), btn = $("#searchBtn");
  open = open ?? panel.hidden;
  panel.hidden = !open; btn.setAttribute("aria-expanded", String(open));
  if (open) { togglePortals(false); loadIndex(); setTimeout(() => $("#q").focus(), 30); }
}

const AR_MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
const AR_DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const utc = d => new Date(d);   // نواكشوط على توقيت غرينتش
const dayName = d => { const t = utc(d); return `${AR_DAYS[t.getUTCDay()]} ${t.getUTCDate()} ${AR_MONTHS[t.getUTCMonth()]}`; };
const longDate = iso => { const [y, m, d] = iso.split("-").map(Number); return `${d} ${AR_MONTHS[m - 1]} ${y}`; };
const hhmm = d => { const t = utc(d); return `${String(t.getUTCHours()).padStart(2, "0")}:${String(t.getUTCMinutes()).padStart(2, "0")}`; };
const fileUrl = dz => `https://erriwaya.com/files/${dz.id}.html`;

function fileItems(dz) {
  const pool = new Map();
  (search.index || []).forEach(a => pool.set("a" + a.id, a));
  state.articles.forEach(a => pool.set("a" + a.id, a));
  state.videos.forEach(v => pool.set("v" + v.id, v));
  const out = [], have = new Set();
  for (const [k, id] of dz.items || []) { const it = pool.get(k + id); if (it) { out.push(it); have.add(k + id); } }
  for (const a of state.articles) if (!have.has("a" + a.id) && liveMatch(dz, a)) out.push(a);
  return out.sort((x, y) => new Date(y.date || 0) - new Date(x.date || 0));

  }

  if ((m = h.match(/^s-(\w+)$/))) {

// ── Firestore REST ──
function fsVal(v) {
  if ("stringValue" in v) return v.stringValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return +v.integerValue;
  if ("doubleValue" in v) return v.doubleValue;
  if ("timestampValue" in v) return v.timestampValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fsVal);
  if ("mapValue" in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, fsVal(x)]));
  return null;
}
function fsDoc(d) { const o = Object.fromEntries(Object.entries(d.fields || {}).map(([k, v]) => [k, fsVal(v)])); o.id = d.name.split("/").pop(); return o; }
async function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]); }

// قراءة خفيفة: النسخة المحفوظة (data.json) تُحدَّث كل نصف ساعة، فلا نسأل قاعدة البيانات إلا عن الأخبار
// المنشورة بعدها. استعلام بلا نتائج يُحسب قراءة واحدة، بدل 61 قراءة لكل زائر سابقاً، فتبقى الخطة المجانية كافية.
async function loadLive() {
  try {
    const newest = state.articles.reduce((m, a) => (a.date && a.date > m ? a.date : m), "");
    const q = { structuredQuery: { from: [{ collectionId: "articles" }],
      orderBy: [{ field: { fieldPath: "createdAt" }, direction: "DESCENDING" }], limit: 20 } };
    if (newest) q.structuredQuery.where = { fieldFilter: { field: { fieldPath: "createdAt" }, op: "GREATER_THAN", value: { timestampValue: newest } } };
    const r = await withTimeout(fetch(`${FS}:runQuery`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(q) }), 8000);
    if (!r.ok) throw 0;
    const fresh = (await r.json()).filter(x => x.document).map(x => normArticle(fsDoc(x.document)));
    if (!fresh.length) return;
    const ids = new Set(fresh.map(a => a.id));
    state.articles = [...fresh, ...state.articles.filter(a => !ids.has(a.id))]
      .sort((x, y) => String(y.date || "").localeCompare(String(x.date || "")));
    refresh();
  } catch {}
}

async function loadSnapshot() {
  try {
    const r = await fetch("data.json", { cache: "no-cache" });
    if (!r.ok) throw 0;
    const d = await r.json();
    state.articles = (d.articles || []).map(normArticle);
    state.videos = (d.videos || []).map(normVideo);
    state.site = d.site || {};
    state.weather = d.weather || {};

    const d = store.get("erriwaya-snap");
    if (d) { state.articles = (d.articles || []).map(normArticle); state.videos = (d.videos || []).map(normVideo); state.site = d.site || {}; state.weather = d.weather || {}; }
  }
  await loadFiles();
  tickClock(); refresh();
}

// ── تفاعل القراء: التفاعلات والتعليقات والاستطلاعات ──
// كلها في Firestore عبر REST دون تسجيل دخول. لكل متصفح معرّف عشوائي (cid) يمنع تكرار التفاعل والتصويت،
// ومعرّف المستند = <الخبر أو الاستطلاع>_<cid> وقواعد الأمان تسمح بالإنشاء مرة واحدة فقط.
// التعليقات لا تظهر إلا بعد موافقة المحرر من لوحة التطبيق (ok = true).
const REACTS = [["like", "أعجبني", "👍"], ["love", "أحببته", "❤️"], ["wow", "مدهش", "😮"], ["sad", "محزن", "😢"], ["angry", "مستفز", "😠"]];
const DOCS = `projects/${PROJECT}/databases/(default)/documents`;
const CID = (() => {
  let c = store.get("erriwaya-cid");
  if (!/^[0-9a-f]{16}$/.test(c || "")) { c = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, "0")).join(""); store.set("erriwaya-cid", c); }
  return c;
})();
const social = { reacts: {}, comments: {}, poll: null, pollLoading: null, votes: {} };
const fv = v => typeof v === "number" ? { integerValue: String(v) } : typeof v === "boolean" ? { booleanValue: v } : { stringValue: String(v) };
async function fsCommit(path, fields) {
  const body = { writes: [{ update: { name: `${DOCS}/${path}`, fields: Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, fv(v)])) },
    currentDocument: { exists: false }, updateTransforms: [{ fieldPath: "t", setToServerValue: "REQUEST_TIME" }] }] };
  const r = await withTimeout(fetch(`${FS.replace(/\/documents$/, "")}/documents:commit`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }), 10000);
  if (!r.ok) throw new Error(r.status);
}
const eq = (f, v) => ({ fieldFilter: { field: { fieldPath: f }, op: "EQUAL", value: fv(v) } });
const and = (...fs) => fs.length === 1 ? fs[0] : { compositeFilter: { op: "AND", filters: fs } };
async function fsCount(coll, ...filters) {
  const q = { structuredAggregationQuery: { structuredQuery: { from: [{ collectionId: coll }], where: and(...filters) }, aggregations: [{ alias: "n", count: {} }] } };
  const r = await withTimeout(fetch(`${FS}:runAggregationQuery`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(q) }), 8000);
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  return +(j[0]?.result?.aggregateFields?.n?.integerValue || 0);
}
async function fsQuery(coll, where, limit = 50) {
  const q = { structuredQuery: { from: [{ collectionId: coll }], where, limit } };
  const r = await withTimeout(fetch(`${FS}:runQuery`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(q) }), 8000);
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).filter(x => x.document).map(x => fsDoc(x.document));
}
const nf = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + " ألف" : String(n);
const mine = () => store.get("erriwaya-reacts") || {};

// التفاعلات

    <span class="re-l">${my ? "شكراً لتفاعلك" : "ما رأيك في الخبر؟"}${total ? ` <em>· ${nf(total)} تفاعل</em>` : ""}</span>
    <div class="re-row" role="group" aria-label="تفاعل مع الخبر">${REACTS.map(([k, label, e]) =>

// ── الحركة: ظهور تدريجي للعناصر عند التمرير ──

  revealIO ||= new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("on"); revealIO.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
  let n = 0;
  document.querySelectorAll("#main .card, #main .sec-h, #main .lead-main, #main .rail a, #main .fcard, #main .poll, #main .short, #main .article > *").forEach(el => {
    el.classList.add("rv"); el.style.setProperty("--d", `${Math.min(n++ % 6, 5) * 50}ms`); revealIO.observe(el);

  const body = { writes: [{
    update: { name: `projects/${PROJECT}/databases/(default)/documents/messages/${id}`,
      fields: { name: { stringValue: name }, contact: { stringValue: contact }, text: { stringValue: text } } },
    currentDocument: { exists: false },
    updateTransforms: [{ fieldPath: "createdAt", setToServerValue: "REQUEST_TIME" }] }] };
  try {
    const r = await withTimeout(fetch(`${FS.replace(/\/documents$/, "")}/documents:commit`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }), 10000);
    if (!r.ok) throw new Error(r.status);
    form.reset(); st.className = "status ok"; st.textContent = "وصلت رسالتك إلى فريق الرواية. شكراً لك.";
  } catch {
    st.className = "status err";
    st.textContent = "تعذّر الإرسال الآن. أعد المحاولة بعد قليل" + (state.site?.email ? `، أو راسلنا على ${state.site.email}.` : ".");
  }
}

// ── الأحداث ──
document.addEventListener("click", e => {
  if (e.target.closest("#portalsBtn")) { toggleSearch(false); togglePortals(); return; }
  if (e.target.closest("#searchBtn")) { toggleSearch(); return; }
  if (!$("#portalsPanel").hidden && !e.target.closest("#portalsPanel")) togglePortals(false);
  const f = e.target.closest("[data-f]");
  if (f) { state.filter = f.dataset.f; state.shown = 12; const y = scrollY; route(); scrollTo(0, y); return; }
  if (e.target.id === "moreBtn") { state.shown += 12; const y = scrollY; route(); scrollTo(0, y); return; }
  if (e.target.closest("[data-back]")) { location.hash = "home"; return; }
  if (e.target.id === "closeV" || e.target.id === "modal") { closeVideo(); return; }
  const rb = e.target.closest("[data-react]"); if (rb) { react(rb); return; }
  const vb = e.target.closest("[data-vote]"); if (vb) { vote(vb); return; }
  const c = e.target.closest("[data-copy]");
  if (c) {
    const done = () => { const t = c.innerHTML; c.innerHTML = c.classList.contains("sh") ? ic("check") : "نُسخ"; setTimeout(() => c.innerHTML = t, 1400); };
    navigator.clipboard?.writeText(c.dataset.copy).then(done, () => {}) ;
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "contact") { e.preventDefault(); sendMessage(e.target); }
  if (e.target.id === "cform") { e.preventDefault(); sendComment(e.target); }
  if (e.target.id === "searchForm") {
    e.preventDefault();
    const q = $("#q").value.trim();
    if (q) { $("#q").blur(); location.hash = "q=" + encodeURIComponent(q); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeVideo(); togglePortals(false); toggleSearch(false); } });
window.addEventListener("hashchange", onHash);

$("#yr").textContent = new Date().getFullYear();
tickClock(); buildFlaps(); setInterval(() => { tickClock(); renderBreaking(); renderTicker(); }, 30000);
lastHash = /^#v-/.test(location.hash) ? "#home" : location.hash;
loadSnapshot().then(() => { if (/^#v-/.test(location.hash)) openVideo(location.hash.slice(3)); loadLive(); });
setInterval(loadLive, 3 * 60 * 1000);
})();
</script>
