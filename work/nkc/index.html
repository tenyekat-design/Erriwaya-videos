<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="../../src/icons.js"></script>
<script src="credits.js"></script>
<script>
(async () => {
const W = 1080, H = 1350;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const C = { navy: '#0B1F4B', navy2: '#142E66', green: '#0A8F65', acc: '#10B981', ink: '#16233F', gray: '#5B6478', light: '#F3F5F9' };
const F = s => `${s}px AlQuds`;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eout = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- assets ----------
const ff = new FontFace('AlQuds', 'url(../../assets/fonts/al-quds.otf)');
await ff.load(); document.fonts.add(ff);
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const LOGO = await loadImg('../../assets/logo-mark.png');
const tint = (img, color) => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height); return c; };
const LOGO_NAVY = tint(LOGO, C.navy);
const IMG = {};
for (const k of Object.keys(window.CREDITS)) IMG[k] = await loadImg('img/' + window.CREDITS[k].file);

// ---------- drawing helpers ----------
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// photo with slow push/pan; mv = [x0,y0,z0, x1,y1,z1] focus (0..1) and zoom
function photo(key, k, mv, dim = 0.35) {
  const img = IMG[key];
  if (!img) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, C.navy2); g.addColorStop(1, C.navy); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); return; }
  const fx = lerp(mv[0], mv[3], k), fy = lerp(mv[1], mv[4], k), z = lerp(mv[2], mv[5], k);
  const s = Math.max(W / img.width, H / img.height) * z;
  const w = img.width * s, h = img.height * s;
  const x = clamp(W / 2 - fx * w, W - w, 0), y = clamp(H / 2 - fy * h, H - h, 0);
  ctx.drawImage(img, x, y, w, h);
  // legibility: soft gradient at the bottom, light overall dim
  ctx.fillStyle = `rgba(6,16,40,${dim * 0.5})`; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, H * 0.42, 0, H);
  g.addColorStop(0, 'rgba(6,16,40,0)'); g.addColorStop(1, `rgba(6,16,40,${0.55 + dim})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const g2 = ctx.createLinearGradient(0, 0, 0, 260);
  g2.addColorStop(0, 'rgba(6,16,40,0.45)'); g2.addColorStop(1, 'rgba(6,16,40,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, 260);
}
function text(str, x, y, size, color = '#fff', align = 'center', a = 1, shadow = true) {
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = F(size); ctx.direction = 'rtl'; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 20; }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}
function textLTR(str, x, y, size, color, align = 'center', a = 1) {
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = F(size); ctx.direction = 'ltr'; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
}
// text that fades and rises in at time t0 (scene-local time lt)
function rise(str, x, y, size, lt, t0, color = '#fff', align = 'center', shadow = true) {
  const p = eout(prog(lt, t0, t0 + 0.55));
  if (p <= 0) return;
  text(str, x, y + (1 - p) * 24, size, color, align, p, shadow);
}
// green tag with slanted left edge (the broadcast look)
function tag(str, xr, y, p, size = 36) {
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= p;
  ctx.font = F(size); ctx.direction = 'rtl';
  const tw = ctx.measureText(str).width, h = size * 1.55, w = tw + 56;
  const x = xr - w * eout(p);
  ctx.fillStyle = C.green;
  ctx.beginPath(); ctx.moveTo(xr, y); ctx.lineTo(x + 18, y); ctx.lineTo(x, y + h); ctx.lineTo(xr, y + h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText(str, xr - 26, y + h / 2 + 2);
  ctx.restore();
}
function bar(x, y, w, p, color = C.acc) { if (p <= 0) return; ctx.fillStyle = color; rrect(x - w * p, y, w * p, 7, 3.5); ctx.fill(); }
function logo(dark, a = 1) {
  const h = 118, w = h * LOGO.width / LOGO.height, x = W - 64 - w, y = 56;
  ctx.save(); ctx.globalAlpha *= a;
  if (!dark) { ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 16; }
  ctx.drawImage(dark ? LOGO_NAVY : LOGO, x, y, w, h);
  ctx.restore();
}
function credit(key, a = 1, dark = false) {
  const c = window.CREDITS[key]; if (!c || !IMG[key]) return;
  textLTR(c.short, 48, H - 40, 20, dark ? 'rgba(22,35,63,0.55)' : 'rgba(255,255,255,0.7)', 'left', a);
}
function source(str, a = 1, dark = true) {
  text(str, W - 64, H - 40, 24, dark ? 'rgba(22,35,63,0.6)' : 'rgba(255,255,255,0.75)', 'right', a, false);
}
function lightBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#EEF1F6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- scenes (start, end in seconds; each fades in over FADE and stays under the next) ----------
const FADE = 0.5;
const SC = [];
const scene = (start, end, dark, draw) => SC.push({ start, end, dark, draw });

// 1. hook
scene(0, 4.6, false, lt => {
  photo('01', lt / 5.1, [0.5, 0.5, 1.18, 0.5, 0.45, 1.04], 0.3);
  tag('إنفوجرافيك', W - 64, 830, prog(lt, 0.2, 0.7));
  rise('نواكشوط', W - 64, 975, 150, lt, 0.4, '#fff', 'right');
  rise('من بضعة آلاف إلى مليون ونصف نسمة', W - 64, 1110, 54, lt, 0.9, '#fff', 'right');
  bar(W - 64, 1170, 220, eout(prog(lt, 1.2, 1.8)));
  credit('01', prog(lt, 0.5, 1));
});

// 2. share of the country
scene(4.6, 10.4, false, lt => {
  photo('02', lt / 6.3, [0.5, 0.5, 1.12, 0.52, 0.5, 1.22], 0.9);
  const cx = W / 2, cy = 640, R = 250;
  const p = eio(prog(lt, 0.5, 2.2)), share = 29.4;
  ctx.save(); ctx.lineCap = 'butt';
  ctx.lineWidth = 64; ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = C.acc;
  ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * share / 100 * p); ctx.stroke();
  ctx.restore();
  const v = (share * p).toFixed(1);
  textLTR(v + '%', cx, cy - 10, 132, '#fff', 'center', prog(lt, 0.3, 0.8));
  text('من سكان موريتانيا', cx, cy + 92, 40, 'rgba(255,255,255,0.85)', 'center', prog(lt, 0.6, 1.1), false);
  rise('قرابة ثلث الموريتانيين', W / 2, 1010, 66, lt, 2.0);
  rise('يعيشون في العاصمة', W / 2, 1095, 66, lt, 2.3);
  const kp = prog(lt, 3.0, 3.6);
  textLTR('1,446,761', W / 2 + 230, 1200, 40, C.acc, 'center', kp);
  text('في نواكشوط', W / 2 + 230, 1245, 26, 'rgba(255,255,255,0.8)', 'center', kp, false);
  textLTR('4,927,532', W / 2 - 230, 1200, 40, '#fff', 'center', kp);
  text('في موريتانيا', W / 2 - 230, 1245, 26, 'rgba(255,255,255,0.8)', 'center', kp, false);
  source('المصدر: التعداد العام للسكان 2023 (ANSADE)', prog(lt, 0.5, 1), false);
});

// 3. 1958
scene(10.4, 15.6, false, lt => {
  photo('03', lt / 5.7, [0.45, 0.5, 1.05, 0.55, 0.5, 1.18], 0.35);
  const n = Math.round(lerp(1940, 1958, eout(prog(lt, 0.2, 1.4))));
  textLTR(String(n), W - 64, 860, 190, '#fff', 'right', prog(lt, 0.1, 0.5));
  ctx.textAlign = 'right';
  rise('بداية تشييد العاصمة', W - 64, 1010, 64, lt, 0.9, '#fff', 'right');
  rise('على ساحل المحيط الأطلسي', W - 64, 1090, 50, lt, 1.3, 'rgba(255,255,255,0.9)', 'right');
  bar(W - 64, 1150, 200, eout(prog(lt, 1.5, 2.1)));
  credit('03', prog(lt, 0.5, 1));
});

// 4. droughts of the 1970s
scene(15.6, 21.0, false, lt => {
  photo('04', lt / 5.9, [0.5, 0.5, 1.2, 0.46, 0.52, 1.06], 0.35);
  tag('السبعينيات', W - 64, 800, prog(lt, 0.15, 0.65));
  rise('موجات الجفاف تدفع', W - 64, 950, 72, lt, 0.5, '#fff', 'right');
  rise('سكان البادية نحو المدينة', W - 64, 1040, 72, lt, 0.8, '#fff', 'right');
  bar(W - 64, 1105, 200, eout(prog(lt, 1.2, 1.8)));
  credit('04', prog(lt, 0.5, 1));
});

// 5. population chart
const DATA = [[1977, 134704], [1988, 393325], [2000, 558195], [2013, 958399], [2023, 1446761]];
scene(21.0, 37.0, true, lt => {
  lightBg();
  rise('سكان نواكشوط', W - 64, 270, 72, lt, 0.2, C.navy, 'right', false);
  rise('حسب التعدادات الرسمية', W - 64, 350, 40, lt, 0.4, C.gray, 'right', false);
  bar(W - 64, 395, 160, eout(prog(lt, 0.5, 1.1)));
  const x0 = 100, x1 = W - 100, base = 1130, top = 560, n = DATA.length;
  const slot = (x1 - x0) / n, bw = slot * 0.56, max = 1500000;
  // grid lines
  ctx.save(); ctx.globalAlpha = prog(lt, 0.4, 1);
  ctx.strokeStyle = 'rgba(11,31,75,0.10)'; ctx.lineWidth = 2;
  [500000, 1000000, 1500000].forEach(v => {
    const y = base - (base - top) * v / max;
    ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  });
  ctx.setLineDash([]); ctx.strokeStyle = 'rgba(11,31,75,0.35)'; ctx.beginPath(); ctx.moveTo(x0, base); ctx.lineTo(x1, base); ctx.stroke();
  ctx.restore();
  const tops = [];
  DATA.forEach(([yr, v], i) => {
    const t0 = 1.0 + i * 2.0, p = eio(prog(lt, t0, t0 + 1.3));
    const cx = x0 + slot * (i + 0.5);
    const h = (base - top) * v / max * p;
    tops.push([cx, base - (base - top) * v / max]);
    textLTR(String(yr), cx, base + 44, 38, C.ink, 'center', prog(lt, t0 - 0.2, t0 + 0.3));
    if (p <= 0) return;
    const last = i === n - 1;
    const g = ctx.createLinearGradient(0, base - h, 0, base);
    g.addColorStop(0, last ? C.acc : C.navy2); g.addColorStop(1, last ? C.green : C.navy);
    ctx.fillStyle = g; rrect(cx - bw / 2, base - h, bw, h, [10, 10, 0, 0]); ctx.fill();
    const val = v * p;
    const label = val >= 1e6 ? (val / 1e6).toFixed(2) + ' مليون' : Math.round(val / 1000) + ' ألف';
    text(label, cx, base - h - 34, 36, last ? C.green : C.navy, 'center', prog(lt, t0 + 0.2, t0 + 0.6), false);
  });
  // growth line over the bars
  const lp = prog(lt, 11.2, 12.6);
  if (lp > 0) {
    ctx.save(); ctx.strokeStyle = C.acc; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.setLineDash([2400]); ctx.lineDashOffset = 2400 * (1 - lp);
    ctx.beginPath(); tops.forEach(([x, y], i) => { const yy = y - 92; i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = C.acc; tops.forEach(([x, y], i) => { if (i / (tops.length - 1) <= lp + 0.01) { ctx.beginPath(); ctx.arc(x, y - 92, 9, 0, 7); ctx.fill(); } });
    ctx.restore();
  }
  // takeaway
  const kp = eout(prog(lt, 12.2, 12.8));
  if (kp > 0) {
    ctx.save(); ctx.globalAlpha = kp;
    ctx.fillStyle = C.navy; rrect(100, 1210, W - 200, 88, 12); ctx.fill();
    ctx.restore();
    text('أكثر من 10 أضعاف منذ 1977', W / 2, 1255, 46, '#fff', 'center', kp, false);
  }
  source('المصدر: التعدادات العامة للسكان، ANSADE', prog(lt, 0.5, 1) * (1 - kp));
});

// 6. the three wilayas
const WIL = [['نواكشوط الجنوبية', 627415], ['نواكشوط الشمالية', 614465], ['نواكشوط الغربية', 204881]];
scene(37.0, 45.0, true, lt => {
  lightBg();
  rise('ثلاث ولايات', W - 64, 270, 72, lt, 0.2, C.navy, 'right', false);
  rise('توزيع سكان العاصمة سنة 2023', W - 64, 350, 40, lt, 0.4, C.gray, 'right', false);
  bar(W - 64, 395, 160, eout(prog(lt, 0.5, 1.1)));
  const total = 1446761, xr = W - 100, maxW = W - 200;
  WIL.forEach(([name, v], i) => {
    const y = 560 + i * 230, t0 = 0.9 + i * 0.9, p = eio(prog(lt, t0, t0 + 1.2));
    rise(name, xr, y, 50, lt, t0 - 0.2, C.navy, 'right', false);
    ctx.fillStyle = 'rgba(11,31,75,0.08)'; rrect(xr - maxW, y + 45, maxW, 56, 10); ctx.fill();
    const w = maxW * v / 650000 * p;
    if (w > 1) { ctx.fillStyle = i === 2 ? C.navy2 : (i === 0 ? C.green : C.navy); rrect(xr - w, y + 45, w, 56, 10); ctx.fill(); }
    const pa = prog(lt, t0 + 0.6, t0 + 1.1);
    textLTR(fmt(v * p), xr - maxW, y + 140, 40, C.ink, 'left', pa);
    textLTR((v / total * 100 * p).toFixed(1) + '%', xr, y + 140, 40, C.green, 'right', pa);
  });
  source('المصدر: التعداد العام للسكان 2023 (ANSADE)', prog(lt, 0.5, 1));
});

// 7. urban sprawl (satellite)
scene(45.0, 50.0, false, lt => {
  photo('05', lt / 5.5, [0.5, 0.5, 1.0, 0.5, 0.5, 1.12], 0.25);
  tag('من الفضاء', W - 64, 860, prog(lt, 0.2, 0.7));
  rise('مدينة تتمدد', W - 64, 1000, 80, lt, 0.5, '#fff', 'right');
  rise('في الرمال على امتداد الساحل', W - 64, 1090, 54, lt, 0.8, '#fff', 'right');
  credit('05', prog(lt, 0.5, 1));
});

// 8. challenges: four quick shots
const CH = [['06', 'الماء'], ['07', 'النقل'], ['08', 'السكن'], ['09', 'الفيضانات']];
CH.forEach(([k, word], i) => {
  const s = 50.0 + i * 2.6;
  scene(s, s + 2.6, false, lt => {
    photo(k, lt / 3.1, i % 2 ? [0.4, 0.5, 1.08, 0.6, 0.5, 1.2] : [0.6, 0.5, 1.2, 0.4, 0.5, 1.08], 0.35);
    text('تحديات النمو', W - 64, 880, 40, 'rgba(255,255,255,0.85)', 'right', 1);
    // counter dots
    for (let j = 0; j < 4; j++) { ctx.fillStyle = j === i ? C.acc : 'rgba(255,255,255,0.35)'; rrect(W - 64 - (j + 1) * 46 + 10, 930, 36, 8, 4); ctx.fill(); }
    const p = eout(prog(lt, 0.05, 0.5));
    ctx.save(); ctx.translate(W - 64, 1060); ctx.scale(lerp(1.15, 1, p), lerp(1.15, 1, p));
    text(word, 0, 0, 140, '#fff', 'right', p);
    ctx.restore();
    credit(k, 1);
  });
});

// 9. closing line
scene(60.4, 65.4, false, lt => {
  photo('10', lt / 5.5, [0.5, 0.55, 1.15, 0.5, 0.5, 1.02], 0.4);
  rise('مدينة وُلدت مع الدولة', W / 2, 960, 76, lt, 0.4);
  rise('وتحمل اليوم ثقلها', W / 2, 1060, 76, lt, 1.2, C.acc);
  credit('10', prog(lt, 0.5, 1));
});

// 10. outro
const OUTRO = 65.4, DURATION = OUTRO + 7.0;
const SOCIAL = [{ icons: ['facebook', 'tiktok', 'youtube'], handle: 'ERRIWAYA' }, { icons: ['instagram'], handle: 'ERRIWAYA.MR' }];
function drawIcon(name, x, y, s) {
  ctx.save(); ctx.fillStyle = C.navy; rrect(x, y, s, s, s * 0.3); ctx.fill();
  ctx.translate(x + s * 0.22, y + s * 0.22); const k = (s * 0.56) / 24; ctx.scale(k, k);
  ctx.fillStyle = '#fff'; ctx.fill(new Path2D(window.ICONS[name])); ctx.restore();
}
scene(OUTRO, DURATION + 1, true, o => {
  lightBg();
  const lp = eout(prog(o, 0.2, 1.2));
  const h = 300, w = h * LOGO.width / LOGO.height;
  ctx.save(); ctx.globalAlpha = lp; ctx.drawImage(LOGO_NAVY, W / 2 - w / 2, 330 + (1 - lp) * 30, w, h); ctx.restore();
  const sp = eout(prog(o, 0.9, 1.5));
  text('نواكشوط في أرقام', W / 2, 720 + (1 - sp) * 20, 52, C.navy, 'center', sp, false);
  bar(W / 2 + 80, 770, 160, eout(prog(o, 1.1, 1.7)));
  text('تابعونا على', W / 2, 850, 28, C.gray, 'center', eout(prog(o, 1.3, 1.8)), false);
  const S = 72, gap = 16;
  SOCIAL.forEach((row, ri) => {
    const y = 900 + ri * 112, rp = prog(o, 1.5 + ri * 0.25, 2.1 + ri * 0.25);
    if (rp <= 0) return;
    ctx.font = F(46); const tw = ctx.measureText(row.handle).width;
    const iw = row.icons.length * S + (row.icons.length - 1) * gap, total = iw + 30 + tw, x0 = W / 2 - total / 2;
    ctx.save(); ctx.globalAlpha = eout(rp);
    ctx.shadowColor = 'rgba(11,31,75,0.12)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
    ctx.fillStyle = '#fff'; rrect(x0 - 18, y - 12, total + 54, S + 24, (S + 24) / 2); ctx.fill();
    ctx.shadowColor = 'transparent';
    row.icons.forEach((ic, i) => drawIcon(ic, x0 + i * (S + gap), y, S));
    ctx.fillStyle = C.navy; ctx.font = F(46); ctx.direction = 'ltr'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(row.handle, x0 + iw + 30 + (1 - eout(rp)) * 20, y + S / 2 + 3);
    ctx.restore();
  });
  const wp = eout(prog(o, 2.0, 2.6));
  textLTR('www.erriwaya.com', W / 2, 1160 + (1 - wp) * 16, 44, C.navy, 'center', wp);
});

function renderFrame(t) {
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let darkLogo = 0, any = false;
  for (const s of SC) {
    if (t < s.start || t > s.end + FADE) continue;
    const a = s.start === 0 ? 1 : eio(prog(t, s.start, s.start + FADE));
    ctx.save(); ctx.globalAlpha = a; s.draw(t - s.start); ctx.restore();
    darkLogo = lerp(darkLogo, s.dark ? 1 : 0, a);
  }
  // logo in the header, hidden on the outro (it is the outro)
  const la = (1 - prog(t, OUTRO, OUTRO + 0.4)) * prog(t, 0.1, 0.6);
  if (la > 0) { logo(false, la * (1 - darkLogo)); logo(true, la * darkLogo); }
}
window.renderFrame = renderFrame;
window.DURATION = DURATION; window.OUTRO = OUTRO;
window.TRANSITIONS = SC.map(s => s.start).filter(x => x > 0);
window.READY = true;
})();
</script>
</body></html>
