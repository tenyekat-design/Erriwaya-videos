<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="../../src/icons.js"></script>
<script src="credits.js"></script>
<script>
(async () => {
// scenes are laid out on a 1080x1350 (feed) page; youtube and story place that page on a larger canvas
const W = 1080, H = 1350;
const FORMAT = new URLSearchParams(location.search).get('format') || 'feed';
const [CW, CH] = { feed: [1080, 1350], youtube: [1920, 1080], story: [1080, 1920] }[FORMAT];
const cv = document.getElementById('c'); cv.width = CW; cv.height = CH;
const ctx = cv.getContext('2d');
// page transform: youtube = page scaled to the full height on the right, a side panel on the left; story = page centred
const PAGE = FORMAT === 'youtube' ? { s: CH / H, x: CW - W * CH / H - 40, y: 0 } : FORMAT === 'story' ? { s: 1, x: 0, y: (CH - H) / 2 } : { s: 1, x: 0, y: 0 };
const pageT = () => ctx.setTransform(PAGE.s, 0, 0, PAGE.s, PAGE.x, PAGE.y);
const C = { navy: '#0B1F4B', navy2: '#142E66', green: '#0A8F65', acc: '#10B981', ink: '#16233F', gray: '#5B6478', light: '#F3F5F9' };
const F = s => `${s}px AlQuds`;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eout = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- assets ----------
const ff = new FontFace('AlQuds', 'url(../../assets/fonts/al-quds.otf)');
await ff.load(); document.fonts.add(ff);
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const LOGO = await loadImg('../../assets/logo-mark.png');
const tint = (img, color) => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height); return c; };
const LOGO_NAVY = tint(LOGO, C.navy);
const IMG = {};
for (const k of Object.keys(window.CREDITS)) IMG[k] = await loadImg('img/' + window.CREDITS[k].file);

// ---------- drawing helpers ----------
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// a full-frame photo, washed out under white, behind a data slide
function washBg(key, k, alpha = 0.22) {
  lightBg();
  const img = IMG[key]; if (!img) return;
  const z = lerp(1.04, 1.14, k), sc = Math.max(CW / img.width, CH / img.height) * z;
  const iw = img.width * sc, ih = img.height * sc;
  const m = ctx.getTransform();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha *= alpha; ctx.filter = 'grayscale(0.3)';
  ctx.drawImage(img, (CW - iw) / 2, (CH - ih) / 2, iw, ih); ctx.filter = 'none'; ctx.restore(); ctx.setTransform(m);
}
function lightBg() {
  const m = ctx.getTransform();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, CH); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#EEF2F7');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  // faint green glow in a corner keeps the white from looking flat
  const r = ctx.createRadialGradient(CW * 0.1, CH * 0.95, 20, CW * 0.1, CH * 0.95, 700);
  r.addColorStop(0, 'rgba(16,185,129,0.10)'); r.addColorStop(1, 'rgba(16,185,129,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, CW, CH);
  ctx.restore(); ctx.setTransform(m);
}
// photo inside a rounded card with a slow push/pan; mv = [fx0,fy0,z0, fx1,fy1,z1]
function card(key, k, mv, box = CARD) {
  const img = IMG[key], { x, y, w, h } = box, r = 28;
  ctx.save();
  ctx.shadowColor = 'rgba(11,31,75,0.18)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#fff'; rrect(x, y, w, h, r); ctx.fill();
  ctx.restore();
  ctx.save(); rrect(x, y, w, h, r); ctx.clip();
  if (img) {
    const fx = lerp(mv[0], mv[3], k), fy = lerp(mv[1], mv[4], k), z = lerp(mv[2], mv[5], k);
    const s = Math.max(w / img.width, h / img.height) * z, iw = img.width * s, ih = img.height * s;
    const ix = clamp(x + w / 2 - fx * iw, x + w - iw, x), iy = clamp(y + h / 2 - fy * ih, y + h - ih, y);
    ctx.filter = 'brightness(1.06) saturate(1.05)';
    ctx.drawImage(img, ix, iy, iw, ih); ctx.filter = 'none';
  } else { ctx.fillStyle = '#DDE3EC'; ctx.fillRect(x, y, w, h); }
  ctx.restore();
  if (w < 500) { ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; rrect(x, y, w, h, r); ctx.stroke(); ctx.restore(); }
  const c = window.CREDITS[key];
  if (c && c.short && img) textLTR(c.short, x + 24, y + h - 26, 20, 'rgba(255,255,255,0.9)', 'left', 1, true);
}
const CARD = { x: 64, y: 210, w: W - 128, h: 660 };
function archiveAt(x, y) {
  ctx.save(); ctx.font = F(24); ctx.direction = 'rtl';
  const tw = ctx.measureText('أرشيف').width;
  ctx.fillStyle = 'rgba(11,31,75,0.78)'; rrect(x + 16, y + 16, tw + 28, 40, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('أرشيف', x + 16 + (tw + 28) / 2, y + 37); ctx.restore();
}
// small 'archive' label in the card's top-left corner
function archive() {
  ctx.save(); ctx.font = F(28); ctx.direction = 'rtl';
  const tw = ctx.measureText('أرشيف').width;
  ctx.fillStyle = 'rgba(11,31,75,0.78)'; rrect(CARD.x + 24, CARD.y + 24, tw + 36, 48, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('أرشيف', CARD.x + 24 + (tw + 36) / 2, CARD.y + 50); ctx.restore();
}
function text(str, x, y, size, color = C.navy, align = 'center', a = 1) {
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = F(size); ctx.direction = 'rtl'; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}
function textLTR(str, x, y, size, color, align = 'center', a = 1, shadow = false) {
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = F(size); ctx.direction = 'ltr'; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 8; }
  ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
}
function rise(str, x, y, size, lt, t0, color = C.navy, align = 'center') {
  const p = eout(prog(lt, t0, t0 + 0.55));
  if (p <= 0) return;
  text(str, x, y + (1 - p) * 24, size, color, align, p);
}
// green tag with slanted left edge (the broadcast look)
function tag(str, xr, y, p, size = 34) {
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= p;
  ctx.font = F(size); ctx.direction = 'rtl';
  const tw = ctx.measureText(str).width, h = size * 1.55, w = tw + 56;
  const x = xr - w * eout(p);
  ctx.fillStyle = C.green;
  ctx.beginPath(); ctx.moveTo(xr, y); ctx.lineTo(x + 18, y); ctx.lineTo(x, y + h); ctx.lineTo(xr, y + h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText(str, xr - 26, y + h / 2 + 2);
  ctx.restore();
}
function bar(x, y, w, p, color = C.acc) { if (p <= 0) return; ctx.fillStyle = color; rrect(x - w * p, y, w * p, 7, 3.5); ctx.fill(); }
function logo(a = 1) {
  const h = 156, w = h * LOGO.width / LOGO.height, x = 60, y = 32;
  ctx.save(); ctx.globalAlpha *= a; ctx.drawImage(LOGO_NAVY, x, y, w, h); ctx.restore();
}
function source(str, a = 1) { text(str, W - 64, H - 40, 24, 'rgba(22,35,63,0.55)', 'right', a); }

// ---------- scenes (start, end in seconds; each fades in over FADE and stays under the next) ----------
const FADE = 0.5;
const SC = [];
const scene = (start, end, draw) => SC.push({ start, end, draw });

// 1. hook
scene(0, 4.6, lt => {
  lightBg();
  card('hook', lt / 5.1, [0.5, 0.55, 1.15, 0.5, 0.45, 1.02], { x: 64, y: 210, w: W - 128, h: 720 });
  tag('ملف', W - 64, 975, prog(lt, 0.2, 0.7));
  rise('نواكشوط', W - 64, 1110, 140, lt, 0.4, C.navy, 'right');
  rise('عاصمة تكبر.. ومشاكلها تكبر معها', W - 64, 1230, 50, lt, 0.9, C.gray, 'right');
  bar(W - 64, 1280, 220, eout(prog(lt, 1.2, 1.8)));
});

// 2. share of the country
scene(4.6, 10.4, lt => {
  washBg('close', lt / 6);
  const cx = W / 2, cy = 600, R = 250;
  const p = eio(prog(lt, 0.5, 2.2)), share = 29.4;
  ctx.save(); ctx.lineCap = 'butt';
  ctx.lineWidth = 64; ctx.strokeStyle = 'rgba(11,31,75,0.08)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = C.acc;
  ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * share / 100 * p); ctx.stroke();
  ctx.restore();
  textLTR((share * p).toFixed(1) + '%', cx, cy - 10, 132, C.navy, 'center', prog(lt, 0.3, 0.8));
  text('من سكان موريتانيا', cx, cy + 92, 40, C.gray, 'center', prog(lt, 0.6, 1.1));
  rise('قرابة ثلث الموريتانيين', W / 2, 1000, 66, lt, 2.0);
  rise('يعيشون في العاصمة', W / 2, 1085, 66, lt, 2.3, C.green);
  const kp = prog(lt, 3.0, 3.6);
  textLTR('1,446,761', W / 2 + 230, 1190, 42, C.green, 'center', kp);
  text('في نواكشوط', W / 2 + 230, 1236, 26, C.gray, 'center', kp);
  textLTR('4,927,532', W / 2 - 230, 1190, 42, C.navy, 'center', kp);
  text('في موريتانيا', W / 2 - 230, 1236, 26, C.gray, 'center', kp);
  source('المصدر: التعداد العام للسكان 2023 (ANSADE)', prog(lt, 0.5, 1));
});

// 3. 1958
scene(10.4, 15.4, lt => {
  lightBg();
  // two archive shots: the early city, then the flag-lined road
  const sw = 2.6;
  if (lt < sw + 0.4) card('arch1', lt / (sw + 0.4), [0.5, 0.45, 1.02, 0.5, 0.55, 1.12]);
  if (lt > sw) { ctx.save(); ctx.globalAlpha *= eio(prog(lt, sw, sw + 0.4)); card('arch3', (lt - sw) / 3, [0.45, 0.5, 1.12, 0.55, 0.5, 1.02]); ctx.restore(); }
  archive();
  const n = Math.round(lerp(1940, 1958, eout(prog(lt, 0.2, 1.4))));
  textLTR(String(n), W - 64, 1000, 150, C.navy, 'right', prog(lt, 0.1, 0.5));
  rise('بداية تشييد العاصمة', W - 64, 1130, 62, lt, 0.9, C.navy, 'right');
  rise('على ساحل المحيط الأطلسي', W - 64, 1210, 46, lt, 1.3, C.gray, 'right');
  bar(W - 64, 1260, 200, eout(prog(lt, 1.5, 2.1)));
});

// 4. droughts of the 1970s (archive photo: tents at the edge of the city)
scene(15.4, 20.6, lt => {
  lightBg();
  card('arch2', lt / 5.5, [0.5, 0.5, 1.15, 0.5, 0.48, 1.02]);
  archive();
  tag('السبعينيات', W - 64, 930, prog(lt, 0.15, 0.65));
  rise('موجات الجفاف تدفع', W - 64, 1070, 70, lt, 0.5, C.navy, 'right');
  rise('سكان البادية نحو المدينة', W - 64, 1160, 70, lt, 0.8, C.green, 'right');
  bar(W - 64, 1220, 200, eout(prog(lt, 1.2, 1.8)));
});

// 5. population chart
const DATA = [[1977, 134704], [1988, 393325], [2000, 558195], [2013, 958399], [2023, 1446761]];
scene(20.6, 35.6, lt => {
  washBg('hook', lt / 15, 0.16);
  rise('سكان نواكشوط', W - 64, 270, 72, lt, 0.2, C.navy, 'right');
  rise('حسب التعدادات الرسمية', W - 64, 350, 40, lt, 0.4, C.gray, 'right');
  bar(W - 64, 395, 160, eout(prog(lt, 0.5, 1.1)));
  const x0 = 100, x1 = W - 100, base = 1130, top = 560, n = DATA.length;
  const slot = (x1 - x0) / n, bw = slot * 0.56, max = 1500000;
  // grid lines
  ctx.save(); ctx.globalAlpha = prog(lt, 0.4, 1);
  ctx.strokeStyle = 'rgba(11,31,75,0.10)'; ctx.lineWidth = 2;
  [500000, 1000000, 1500000].forEach(v => {
    const y = base - (base - top) * v / max;
    ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  });
  ctx.setLineDash([]); ctx.strokeStyle = 'rgba(11,31,75,0.35)'; ctx.beginPath(); ctx.moveTo(x0, base); ctx.lineTo(x1, base); ctx.stroke();
  ctx.restore();
  const tops = [];
  DATA.forEach(([yr, v], i) => {
    const t0 = 1.0 + i * 2.0, p = eio(prog(lt, t0, t0 + 1.3));
    const cx = x0 + slot * (i + 0.5);
    const h = (base - top) * v / max * p;
    tops.push([cx, base - (base - top) * v / max]);
    textLTR(String(yr), cx, base + 44, 38, C.ink, 'center', prog(lt, t0 - 0.2, t0 + 0.3));
    if (p <= 0) return;
    const last = i === n - 1;
    const g = ctx.createLinearGradient(0, base - h, 0, base);
    g.addColorStop(0, last ? C.acc : C.navy2); g.addColorStop(1, last ? C.green : C.navy);
    ctx.fillStyle = g; rrect(cx - bw / 2, base - h, bw, h, [10, 10, 0, 0]); ctx.fill();
    const val = v * p;
    const label = val >= 1e6 ? (val / 1e6).toFixed(2) + ' مليون' : Math.round(val / 1000) + ' ألف';
    text(label, cx, base - h - 34, 36, last ? C.green : C.navy, 'center', prog(lt, t0 + 0.2, t0 + 0.6));
  });
  // takeaway
  const kp = eout(prog(lt, 12.2, 12.8));
  if (kp > 0) {
    ctx.save(); ctx.globalAlpha = kp;
    ctx.fillStyle = C.green; rrect(100, 1210, W - 200, 88, 12); ctx.fill();
    ctx.restore();
    text('أكثر من 10 أضعاف منذ 1977', W / 2, 1255, 46, '#fff', 'center', kp);
  }
  source('المصدر: التعدادات العامة للسكان، ANSADE', prog(lt, 0.5, 1) * (1 - kp));
});

// 6. successive governments, plans on paper
const PLANS = [['1959', 'مخطط لوكونت الأول'], ['1970', 'المخطط التوجيهي'], ['1982', 'مخطط عمراني جديد'], ['2015', 'مخطط توجيهي حتى 2030']];
scene(35.6, 44.6, lt => {
  washBg('arch1', lt / 9, 0.2);
  rise('حكومات متعاقبة', W - 64, 270, 72, lt, 0.2, C.navy, 'right');
  rise('وخطط على الورق', W - 64, 355, 60, lt, 0.5, C.green, 'right');
  bar(W - 64, 405, 160, eout(prog(lt, 0.7, 1.3)));
  const xr = W - 64, top = 500, step = 128;
  // spine
  const sp = eio(prog(lt, 0.9, 3.4));
  ctx.fillStyle = 'rgba(11,31,75,0.15)'; ctx.fillRect(xr - 236, top, 4, (PLANS.length - 1) * step * sp + 1);
  PLANS.forEach(([yr, name], i) => {
    const t0 = 1.0 + i * 0.6, p = eout(prog(lt, t0, t0 + 0.5));
    if (p <= 0) return;
    const y = top + i * step;
    ctx.save(); ctx.globalAlpha *= p;
    ctx.fillStyle = C.acc; ctx.beginPath(); ctx.arc(xr - 234, y, 12 * p, 0, 7); ctx.fill();
    ctx.restore();
    textLTR(yr, xr, y, 56, C.navy, 'right', p);
    text(name, xr - 270, y, 42, C.ink, 'right', p);
  });
  { const ap = eout(prog(lt, 0.6, 1.2)); ctx.save(); ctx.globalAlpha *= ap; card('arch1', lt / 9, [0.5, 0.5, 1.05, 0.5, 0.5, 1.15], { x: 64, y: 470 + (1 - ap) * 20, w: 230, h: 380 }); archiveAt(64, 470); ctx.restore(); }
  rise('ثم مخطط آخر بأفق 2040', xr - 270, top + PLANS.length * step - 10, 40, lt, 3.6, C.gray, 'right');
  const kp = eout(prog(lt, 4.6, 5.1));
  if (kp > 0) {
    ctx.save(); ctx.globalAlpha *= kp; ctx.translate(W / 2, 1170); ctx.scale(lerp(1.2, 1, kp), lerp(1.2, 1, kp));
    ctx.fillStyle = C.navy; rrect(-(W - 200) / 2, -48, W - 200, 96, 12); ctx.fill();
    ctx.restore();
    text('قليل منها طُبّق فعلياً', W / 2, 1172, 52, '#fff', 'center', kp);
  }
  source('المصدر: دراسات حول عمران نواكشوط (Cahiers Géographiques de l’Ouest)', prog(lt, 0.5, 1));
});

// 6b. what was achieved (brief), before the problems
const GOOD = [['الماء', 'إديني: أكثر من 100 ألف م³ يومياً (2026)'], ['العمران', 'مناطق ومبانٍ عصرية جديدة'], ['النقل', 'مطار أم التونسي الدولي (2016)']];
scene(44.6, 50.1, lt => {
  washBg('hook', lt / 7, 0.18);
  rise('ما تحقق', W - 64, 270, 72, lt, 0.2, C.navy, 'right');
  rise('خطوات لم تواكب النمو', W - 64, 350, 40, lt, 0.4, C.gray, 'right');
  bar(W - 64, 395, 160, eout(prog(lt, 0.5, 1.1)));
  GOOD.forEach(([k, line], i) => {
    const t0 = 0.8 + i * 0.7, p = eout(prog(lt, t0, t0 + 0.5));
    if (p <= 0) return;
    const y = 500 + i * 200;
    ctx.save(); ctx.globalAlpha *= p; ctx.translate((1 - p) * -30, 0);
    ctx.shadowColor = 'rgba(11,31,75,0.10)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; rrect(64, y, W - 128, 160, 22); ctx.fill();
    ctx.shadowColor = 'transparent';
    // check mark
    ctx.fillStyle = C.acc; ctx.beginPath(); ctx.arc(W - 130, y + 80, 36, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(W - 147, y + 80); ctx.lineTo(W - 135, y + 93); ctx.lineTo(W - 112, y + 67); ctx.stroke();
    ctx.restore();
    text(k, W - 190, y + 52, 32, C.green, 'right', p);
    text(line, W - 190, y + 105, 42, C.navy, 'right', p);
  });
});

// 6c. modern areas and buildings: a large card and a smaller overlapping one
const MOD = ['m1', 'm4', 'm2', 'm3', 'm6', 'm5'];
const MS = 1.4;
scene(50.1, 58.5, lt => {
  lightBg();
  const i = Math.min(MOD.length - 1, Math.floor(lt / MS)), li = lt - i * MS;
  const big = { x: 64, y: 210, w: W - 128, h: 700 };
  if (i > 0 && li < 0.3) card(MOD[i - 1], 1, [0.5, 0.5, 1.02, 0.5, 0.5, 1.12], big);
  ctx.save(); ctx.globalAlpha *= i > 0 ? eio(prog(li, 0, 0.3)) : 1;
  card(MOD[i], li / (MS + 0.3), i % 2 ? [0.45, 0.5, 1.12, 0.55, 0.5, 1.02] : [0.55, 0.5, 1.02, 0.45, 0.5, 1.12], big);
  ctx.restore();
  // the next photo previewed in a small card overlapping the corner
  const nx = MOD[(i + 1) % MOD.length], sp = eout(prog(li, 0.2, 0.6));
  ctx.save(); ctx.globalAlpha *= sp;
  card(nx, li / MS, [0.5, 0.5, 1.05, 0.5, 0.5, 1.1], { x: 100, y: 760 + (1 - sp) * 20, w: 380, h: 250 });
  ctx.restore();
  tag('ما تحقق', W - 64, 960, prog(lt, 0.2, 0.7));
  rise('مناطق ومبانٍ عصرية', W - 64, 1095, 70, lt, 0.4, C.navy, 'right');
  rise('واجهة جديدة لأجزاء من العاصمة', W - 64, 1180, 44, lt, 0.7, C.gray, 'right');
  const kp = eout(prog(lt, 7.0, 7.5));
  if (kp > 0) {
    ctx.save(); ctx.globalAlpha *= kp; ctx.fillStyle = 'rgba(255,255,255,0.97)'; ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2, H / 2); ctx.scale(lerp(1.2, 1, kp), lerp(1.2, 1, kp));
    ctx.fillStyle = C.navy; rrect(-(W - 200) / 2, -60, W - 200, 120, 14); ctx.fill(); ctx.restore();
    text('لكن المشاكل أكبر', W / 2, H / 2 + 2, 64, '#fff', 'center', kp);
  }
});

// 7. the problems: a photo card and one number each
const PROB = [
  { img: 'pr0', tag: 'الصرف الصحي', pre: 'لا تتجاوز', big: '3%', l1: 'نسبة الولوج لخدمات الصرف الصحي (2024)', src: 'المصدر: المكتب الوطني للصرف الصحي' },
  { img: 'pr1', tag: 'النظافة', pre: 'أكثر من', big: '230 طناً', l1: 'من النفايات رُفعت من الشاطئ في حملة واحدة', l2: 'أغلبها بلاستيك (2026)', src: 'المصدر: الوكالة الموريتانية للأنباء' },
  { img: 'pr2', tag: 'الأحياء العشوائية', pre: 'عمليات إزالة', big: 'متكررة', l1: 'لكن القضاء على العشوائيات ظل صعباً', src: 'المصدر: Gret' },
  { img: 'pr3', tag: 'الفيضانات', pre: '', big: '60%', l1: 'من المدينة دون متر فوق سطح البحر', l2: 'وأمطار سبتمبر 2026 شلّت حركة العاصمة', src: 'المصادر: Comptes Rendus Géoscience، allAfrica' },
  { img: 'pr4', tag: 'زحف البحر', pre: '', big: '11', l1: 'ثغرة ما زالت مفتوحة في الحاجز الرملي', l2: 'من أصل 20، بعد سدّ 9 (نوفمبر 2025)', src: 'المصدر: allAfrica' },
  { img: 'pr5', tag: 'الماء', pre: 'أزمة عطش', big: '2024', l1: 'مياه النهر الموحلة عطّلت معالجة آفطوط', l2: 'وأزمة مماثلة في صيف 2023', src: 'المصادر: Le360، Afrik21' },
];
const PD = 4.6, P0 = 58.5;
const PCARD = { x: 64, y: 210, w: W - 128, h: 560 };
PROB.forEach((p, i) => {
  scene(P0 + i * PD, P0 + (i + 1) * PD, lt => {
    lightBg();
    card(p.img, lt / 5.5, i % 2 ? [0.42, 0.5, 1.16, 0.58, 0.5, 1.04] : [0.58, 0.5, 1.04, 0.42, 0.5, 1.16], PCARD);
    const ip = eout(prog(lt, 0.5, 0.9)), k2 = p.img + 'b';
    if (IMG[k2]) { ctx.save(); ctx.globalAlpha *= ip; card(k2, lt / 5, [0.5, 0.5, 1.05, 0.5, 0.5, 1.15], { x: 100, y: PCARD.y + PCARD.h - 230 + (1 - ip) * 20, w: 330, h: 210 }); ctx.restore(); }
    tag(p.tag, W - 64, PCARD.y + PCARD.h - 70, prog(lt, 0.1, 0.55), 40);
    for (let j = 0; j < PROB.length; j++) { ctx.fillStyle = j === i ? C.acc : 'rgba(11,31,75,0.15)'; rrect(64 + j * 46, 830, 36, 8, 4); ctx.fill(); }
    text('مشاكل مزمنة', W - 64, 836, 34, C.gray, 'right', 1);
    if (p.pre) rise(p.pre, W - 64, 895, 46, lt, 0.3, C.navy, 'right');
    const bp = eout(prog(lt, 0.4, 1.0));
    ctx.save(); ctx.globalAlpha *= bp;
    ctx.font = F(150); ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.green; ctx.fillText(p.big, W - 64, 1035 + (1 - bp) * 30);
    ctx.restore();
    rise(p.l1, W - 64, 1160, 48, lt, 0.9, C.navy, 'right');
    if (p.l2) rise(p.l2, W - 64, 1230, 40, lt, 1.2, C.gray, 'right');
    else bar(W - 64, 1210, 200, eout(prog(lt, 1.3, 1.9)));
    source(p.src, prog(lt, 0.6, 1.1));
  });
});

// 8. closing line
const CL = P0 + PROB.length * PD;
scene(CL, CL + 5.0, lt => {
  lightBg();
  card('close', lt / 5.3, [0.5, 0.5, 1.12, 0.5, 0.5, 1.0]);
  rise('قرابة سبعة عقود على التأسيس', W / 2, 1040, 66, lt, 0.4);
  rise('والعاصمة ما زالت تنتظر', W / 2, 1140, 74, lt, 1.2, C.green);
});

// 10. outro
const OUTRO = CL + 5.0, DURATION = OUTRO + 7.0;
const SOCIAL = [{ icons: ['facebook', 'tiktok', 'youtube'], handle: 'ERRIWAYA' }, { icons: ['instagram'], handle: 'ERRIWAYA.MR' }];
function drawIcon(name, x, y, s) {
  ctx.save(); ctx.fillStyle = C.navy; rrect(x, y, s, s, s * 0.3); ctx.fill();
  ctx.translate(x + s * 0.22, y + s * 0.22); const k = (s * 0.56) / 24; ctx.scale(k, k);
  ctx.fillStyle = '#fff'; ctx.fill(new Path2D(window.ICONS[name])); ctx.restore();
}
scene(OUTRO, DURATION + 1, o => {
  lightBg();
  const lp = eout(prog(o, 0.2, 1.2));
  const h = 300, w = h * LOGO.width / LOGO.height;
  ctx.save(); ctx.globalAlpha = lp; ctx.drawImage(LOGO_NAVY, W / 2 - w / 2, 330 + (1 - lp) * 30, w, h); ctx.restore();
  const sp = eout(prog(o, 0.9, 1.5));
  text('نواكشوط.. مدينة تنتظر', W / 2, 720 + (1 - sp) * 20, 52, C.navy, 'center', sp);
  bar(W / 2 + 80, 770, 160, eout(prog(o, 1.1, 1.7)));
  text('تابعونا على', W / 2, 850, 28, C.gray, 'center', eout(prog(o, 1.3, 1.8)));
  const S = 72, gap = 16;
  SOCIAL.forEach((row, ri) => {
    const y = 900 + ri * 112, rp = prog(o, 1.5 + ri * 0.25, 2.1 + ri * 0.25);
    if (rp <= 0) return;
    ctx.font = F(46); const tw = ctx.measureText(row.handle).width;
    const iw = row.icons.length * S + (row.icons.length - 1) * gap, total = iw + 30 + tw, x0 = W / 2 - total / 2;
    ctx.save(); ctx.globalAlpha = eout(rp);
    ctx.shadowColor = 'rgba(11,31,75,0.12)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
    ctx.fillStyle = '#fff'; rrect(x0 - 18, y - 12, total + 54, S + 24, (S + 24) / 2); ctx.fill();
    ctx.shadowColor = 'transparent';
    row.icons.forEach((ic, i) => drawIcon(ic, x0 + i * (S + gap), y, S));
    ctx.fillStyle = C.navy; ctx.font = F(46); ctx.direction = 'ltr'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(row.handle, x0 + iw + 30 + (1 - eout(rp)) * 20, y + S / 2 + 3);
    ctx.restore();
  });
  const wp = eout(prog(o, 2.0, 2.6));
  textLTR('www.erriwaya.com', W / 2, 1160 + (1 - wp) * 16, 44, C.navy, 'center', wp);
});

// youtube side panel: logo, title and the chapter list with the current one highlighted
const CHAPTERS = [[0, 'البداية'], [4.6, 'حصة العاصمة'], [10.4, 'التأسيس والنزوح'], [20.6, 'نمو السكان'], [35.6, 'خطط على الورق'], [44.6, 'ما تحقق'], [58.5, 'مشاكل مزمنة'], [86.1, 'مدينة تنتظر']];
function panel(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a;
  const h = 160, w = h * LOGO.width / LOGO.height;
  ctx.drawImage(LOGO_NAVY, 96, 38, w, h);
  const xr = PAGE.x - 70;
  text('نواكشوط', xr, 330, 110, C.navy, 'right');
  text('عاصمة تكبر.. ومشاكلها تكبر معها', xr, 430, 42, C.gray, 'right');
  ctx.fillStyle = C.acc; rrect(xr - 160, 478, 160, 7, 3.5); ctx.fill();
  let cur = 0; CHAPTERS.forEach(([c], i) => { if (t >= c) cur = i; });
  CHAPTERS.forEach(([c, name], i) => {
    const y = 570 + i * 58, on = i === cur;
    ctx.fillStyle = on ? C.acc : 'rgba(11,31,75,0.15)'; rrect(xr - 10, y - 18, 10, 36, 5); ctx.fill();
    text(name, xr - 30, y + 2, on ? 38 : 32, on ? C.navy : 'rgba(22,35,63,0.45)', 'right');
  });
  ctx.restore();
}
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, CW, CH);
  for (const s of SC) {
    if (t < s.start || t > s.end + FADE) continue;
    const a = (s.start === 0 ? 1 : eio(prog(t, s.start + 0.1, s.start + FADE))) * (1 - eio(prog(t, s.end, s.end + 0.3)));
    pageT();
    // the outro is centred on the whole canvas
    if (s.start === OUTRO && FORMAT === 'youtube') ctx.setTransform(PAGE.s, 0, 0, PAGE.s, (CW - W * PAGE.s) / 2, 0);
    ctx.save(); ctx.globalAlpha = a; s.draw(t - s.start); ctx.restore();
  }
  const la = (1 - prog(t, OUTRO, OUTRO + 0.4)) * prog(t, 0.1, 0.6);
  pageT();
  if (FORMAT === 'youtube') panel(t, la); else if (la > 0) logo(la);
}
window.renderFrame = renderFrame;
window.DURATION = DURATION; window.OUTRO = OUTRO;
window.TRANSITIONS = SC.map(s => s.start).filter(x => x > 0);
window.READY = true;
})();
</script>
