<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Erriwaya – فيديو نصي</title>
<style>
  @font-face { font-family: AlQuds; src: url(../assets/fonts/al-quds.otf) format('opentype'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="icons.js"></script>
<script>
  // ?edition=YYYY-MM-DD selects the folder in editions/ (text.js, photos, clips)
  window.EDITION_DIR = '../editions/' + (new URLSearchParams(location.search).get('edition') || '');
  window.FRAMES_DIR = new URLSearchParams(location.search).get('frames') || '';
  const s = document.createElement('script');
  s.src = window.EDITION_DIR + '/text.js';
  s.onload = () => { const app = document.createElement('script'); app.src = 'text.js'; document.body.appendChild(app); };
  document.body.appendChild(s);
</script>
</body>
</html>
