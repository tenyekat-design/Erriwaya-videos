<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Erriwaya – الموجز الإخباري</title>
<style>
  @font-face { font-family: AlQuds; src: url(../assets/fonts/al-quds.otf) format('opentype'); }
  html, body { margin: 0; background: #fff; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="map-data.js"></script>
<script src="icons.js"></script>
<script>
  // ?edition=YYYY-MM-DD selects the folder in editions/ (content, images, voice-over)
  window.EDITION_DIR = '../editions/' + (new URLSearchParams(location.search).get('edition') || '');
  const edition = document.createElement('script');
  edition.src = window.EDITION_DIR + '/edition.js';
  edition.onload = () => { const app = document.createElement('script'); app.src = 'app.js'; document.body.appendChild(app); };
  document.body.appendChild(edition);
</script>
</body>
</html>
