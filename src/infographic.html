<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Erriwaya – إنفوجرافيك</title>
<!-- Animated infographic (1080x1350, 1080x1920 with &format=story, 1920x1080 with &format=youtube; no voice-over): light background, navy / Erriwaya green / grey, scenes of charts.
     ?graphic=<folder in graphics/> whose graphic.js has type: 'infographic'. Rendered by tools/render-graphic.js. -->
<style>
  @font-face { font-family: AlQuds; src: url(../assets/fonts/al-quds.otf) format('opentype'); }
  :root { --navy: #0B1F4B; --acc: #0A8F65; --acc2: #10B981; --grey: #6B7385; --line: #DCD8CF; --bg: #F5F3EE; --card: #FFFFFF; }
  html, body { margin: 0; background: var(--bg); }
  #stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--navy);
    background: radial-gradient(rgba(11,31,75,.07) 1.4px, transparent 1.6px) 0 0 / 28px 28px, var(--bg);
    font-family: AlQuds, sans-serif; }
  .abs { position: absolute; }
  /* the 1080x1350 design; &format=story continues it on the same background in 1080x1920, moved down
     below TikTok's top bar and leaving the bottom free for its caption */
  #frame { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; overflow: hidden; transform-origin: 0 0; }
  .story #stage { height: 1920px; }
  .story #frame { transform: translateY(250px); }
  #kicker { display: none; left: 0; right: 0; top: 120px; text-align: center; color: var(--navy); font-size: 44px; }
  #kicker i { display: block; width: 90px; height: 6px; background: var(--acc); margin: 8px auto 0; }
  .story #kicker { display: block; }
  /* &format=youtube: the design at 80% on the right, the scene's photo full height on the left (fading into the
     background); in the outro the photo goes and the design slides to the centre */
  .youtube #stage { width: 1920px; height: 1080px; }
  .youtube #frame { transform: translateX(1056px) scale(.8); }
  #side { display: none; left: 0; top: 0; width: 1100px; height: 1080px; overflow: hidden; }
  #side img { position: absolute; max-width: none; }
  #side::after { content: ''; position: absolute; inset: 0; background: linear-gradient(270deg, var(--bg) 0%, rgba(245,243,238,0) 22%), linear-gradient(0deg, rgba(11,31,75,.25), rgba(11,31,75,0) 40%); }
  .youtube #side { display: block; }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  #logo { left: 64px; top: 56px; width: 130px; height: 176px; background: var(--navy);
    -webkit-mask: url(../assets/logo-mark.png) center / contain no-repeat; mask: url(../assets/logo-mark.png) center / contain no-repeat; }
  #htitle { right: 64px; top: 66px; width: 760px; text-align: right; }
  #htitle .t { font-size: 40px; line-height: 1.32; }
  #htitle .s { font-size: 28px; color: var(--grey); margin-top: 4px; }
  #rule { left: 56px; right: 56px; top: 262px; height: 2px; background: var(--line); }
  #rule i { position: absolute; right: 0; top: -2px; height: 6px; width: 120px; background: var(--acc); }
  #scene { inset: 0; }
  /* section heading */
  .hd { position: absolute; right: 56px; top: 282px; display: flex; align-items: center; gap: 18px; }
  .hd .n { width: 62px; height: 62px; background: var(--acc); color: #fff; font-size: 40px; display: flex; align-items: center; justify-content: center; padding-bottom: 6px; box-sizing: border-box; }
  .hd .h { font-size: 60px; }
  .unit { position: absolute; right: 56px; top: 390px; font-size: 28px; color: var(--grey); }
  /* photo band behind a section heading: real footage of the trade, navy wash under the white heading */
  .banner { position: absolute; left: 0; right: 0; top: 270px; height: 168px; overflow: hidden; }
  .banner img { position: absolute; max-width: none; }
  .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(270deg, rgba(11,31,75,.94) 0%, rgba(11,31,75,.78) 45%, rgba(11,31,75,.2) 100%); }
  .hd.onph { color: #fff; top: 290px; }
  .unit.onph { color: rgba(255,255,255,.85); top: 384px; }
  .flag { display: inline-block; vertical-align: middle; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .name { font-size: 46px; vertical-align: middle; margin-right: 16px; }
  .note { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--acc); color: #fff;
    font-size: 42px; padding: 6px 36px 18px; }
  .note.navy { background: var(--navy); }
  /* horizontal bars */
  .row { position: absolute; left: 56px; right: 56px; }
  .row .lab { position: absolute; right: 0; top: 0; }
  .row .val { position: absolute; left: 0; top: -14px; font-size: 84px; line-height: 1; }
  .row .val small { font-size: 36px; margin-right: 10px; }
  .row .bar { position: absolute; right: 0; top: 96px; height: 70px; width: 0; }
  .row .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--acc) 0 10px, var(--acc2) 10px 20px); }
  .axis { position: absolute; left: 56px; right: 56px; height: 2px; background: var(--grey); opacity: .5; }
  .tick { position: absolute; font-size: 26px; color: var(--grey); transform: translateX(50%); }
  /* several rows */
  .hr { position: absolute; left: 56px; right: 56px; height: 130px; }
  .hr .lab { position: absolute; right: 0; top: 4px; }
  .hr .name { font-size: 40px; margin-right: 14px; }
  .hv { position: absolute; left: 0; top: -6px; font-size: 64px; line-height: 1; }
  .hv small { font-size: 30px; margin-right: 10px; color: var(--grey); }
  .hr.hi .hv { font-size: 74px; top: -14px; }
  .hv.na { font-size: 30px; color: var(--grey); top: 14px; }
  .htrack { position: absolute; right: 0; left: 0; top: 74px; height: 42px; background: #ECE9E2; }
  .htrack.dash { background: none; border-top: 3px dashed #C9C3B6; height: 0; top: 94px; }
  .hbar { position: absolute; right: 0; top: 74px; height: 42px; width: 0; }
  .hr.hi .hbar { box-shadow: 0 8px 22px rgba(10,143,101,.3); }
  /* map */
  .mlab { position: absolute; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; color: #fff; }
  .mlab .mt { font-size: 28px; display: flex; align-items: center; gap: 10px; justify-content: center; }
  .mlab .mv { font-size: 68px; line-height: 1; margin-top: 4px; }
  .mlab .mv em { font-style: normal; font-size: 30px; margin-left: 8px; }
  .mlab .mv small { font-size: 30px; margin-right: 8px; }
  .mlab .ms { font-size: 23px; margin-top: 4px; }
  .mlab.res, .mlab.est { padding: 8px 18px 12px; }
  .mlab.res { background: rgba(5,80,56,.88); }
  .mlab.est { background: rgba(11,31,75,.9); }
  .mlab.nd { color: var(--navy); background: rgba(255,255,255,.85); padding: 6px 14px 10px; box-shadow: 0 4px 14px rgba(11,31,75,.12); }
  .mlab.nd .mt { font-size: 27px; }
  .legend { position: absolute; left: 56px; right: 56px; top: 984px; display: flex; justify-content: center; gap: 30px; font-size: 26px; color: var(--grey); white-space: nowrap; }
  .legend i { display: inline-block; width: 26px; height: 26px; vertical-align: middle; margin-left: 10px; }
  /* equal cards */
  .tile { position: absolute; width: 310px; height: 340px; line-height: 1.15; background: var(--card); box-shadow: 0 12px 34px rgba(11,31,75,.11); text-align: center; box-sizing: border-box; padding-top: 26px; }
  .tile .band { position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--navy); }
  .tile .tc { font-size: 34px; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .tile .tv { font-size: 88px; line-height: 1; margin-top: 14px; color: var(--navy); }
  .tile .tv em { font-style: normal; font-size: 28px; color: var(--grey); margin-left: 8px; }
  .tile .tl { font-size: 32px; color: var(--acc); margin-top: 6px; }
  .tile .ts { font-size: 23px; color: var(--grey); margin-top: 10px; line-height: 1.35; padding: 0 8px; white-space: nowrap; }
  /* vertical bars */
  .col { position: absolute; bottom: 334px; width: 230px; height: 0; }
  .cv { position: absolute; width: 330px; text-align: center; }
  .cv b { display: block; font-size: 104px; line-height: 1; font-weight: normal; }
  .cv span { font-size: 32px; color: var(--grey); }
  .cl { position: absolute; width: 330px; text-align: center; top: 1030px; }
  .cl .name { font-size: 40px; }
  .grid { position: absolute; left: 56px; right: 56px; height: 0; border-top: 2px dashed var(--line); }
  .grid span { position: absolute; left: 0; top: -40px; font-size: 26px; color: var(--grey); }
  .base { position: absolute; left: 56px; right: 56px; top: 1016px; height: 3px; background: var(--navy); }
  /* cards */
  .card { position: absolute; top: 452px; width: 452px; height: 650px; background: var(--card); box-shadow: 0 14px 40px rgba(11,31,75,.12);
    text-align: center; box-sizing: border-box; padding-top: 44px; }
  .card .band { position: absolute; left: 0; right: 0; top: 0; height: 12px; }
  .card .dol { width: 120px; height: 120px; border-radius: 50%; margin: 26px auto 6px; color: #fff; font: bold 84px/128px Arial, sans-serif; }
  .card .ap { font-size: 34px; color: var(--grey); }
  .card .big { font-size: 128px; line-height: 1.05; }
  .card .lb { font-size: 38px; }
  .card .mini { position: absolute; right: 40px; bottom: 40px; height: 14px; }
  .card .track { position: absolute; left: 40px; right: 40px; bottom: 40px; height: 14px; background: #ECE9E2; }
  /* conclusion */
  .photo { position: absolute; left: 0; right: 0; overflow: hidden; }
  .photo img { position: absolute; max-width: none; }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(245,243,238,0) 55%, var(--bg) 100%); }
  .photo.dim::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 260px; z-index: 1; background: linear-gradient(180deg, rgba(5,14,36,.5), rgba(5,14,36,0)); }
  .big2 { position: absolute; left: 40px; right: 40px; text-align: center; font-size: 76px; line-height: 1.35; }
  .small { position: absolute; left: 90px; right: 90px; text-align: center; font-size: 29px; color: var(--grey); border: 2px solid var(--line); padding: 14px 24px 22px; background: rgba(255,255,255,.6); }
  .srcs { position: absolute; left: 70px; right: 70px; text-align: center; font-size: 24px; color: var(--grey); line-height: 1.5; }
  /* title */
  .tt { position: absolute; left: 40px; right: 40px; text-align: center; font-size: 80px; line-height: 1.28; }
  .tt .r { color: var(--acc); }
  .sub { position: absolute; left: 0; right: 0; text-align: center; font-size: 38px; color: var(--grey); }
  .w { display: inline-block; white-space: pre; }
  /* footer */
  #foot { left: 56px; right: 56px; top: 1250px; height: 100px; border-top: 2px solid var(--line); display: flex; justify-content: center;
    align-items: center; gap: 26px; direction: ltr; }
  #foot .g { display: flex; align-items: center; gap: 10px; }
  #foot .ic { width: 42px; height: 42px; background: var(--navy); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  #foot .ic svg { width: 24px; height: 24px; fill: #fff; }
  #foot .ic.site { background: none; overflow: hidden; }
  #foot .ic.site img { width: 42px; height: 42px; }
  /* outro: the logo grows to the centre, then the website and handles appear one by one */
  .oc { position: absolute; left: 0; right: 0; text-align: center; }
  .oc.tag { top: 790px; font-size: 56px; }
  .oc.rl { top: 902px; left: 460px; right: 460px; height: 7px; background: var(--acc); }
  .orows { position: absolute; left: 0; right: 0; top: 950px; direction: ltr; }
  .orow { display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 26px; }
  .orow .ic { width: 72px; height: 72px; background: var(--navy); border-radius: 18px; display: flex; align-items: center; justify-content: center; }
  .orow .ic svg { width: 42px; height: 42px; fill: #fff; }
  .orow .ic.site { background: none; overflow: hidden; }
  .orow .ic.site img { width: 72px; height: 72px; }
  .orow .h { font: bold 44px 'DejaVu Sans', Arial, sans-serif; letter-spacing: 3px; margin-left: 10px; }
  #foot .h { font: bold 25px 'DejaVu Sans', Arial, sans-serif; letter-spacing: 1.5px; margin-left: 6px; }
</style>
</head>
<body>
<div id="stage"><div id="side" class="abs"><img id="sideimg"></div><div id="kicker" class="abs">إنفوجرافيك<i></i></div><div id="frame">
  <div id="scene" class="abs"></div>
  <div id="logo" class="abs"></div>
  <div id="htitle" class="abs"></div>
  <div id="rule" class="abs"><i></i></div>
  <div id="foot" class="abs"></div>
</div></div>
<script src="icons.js"></script>
<script>
const NAME = new URLSearchParams(location.search).get('graphic');
const DIR = '../graphics/' + NAME + '/', FRAMES = '../frames/graphic-' + NAME + '/';
const W = 1080, H = 1350, FPS = 30;
const FORMAT = new URLSearchParams(location.search).get('format');
if (FORMAT === 'story' || FORMAT === 'youtube') document.documentElement.classList.add(FORMAT);
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eout = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// Erriwaya colours: Mauritania navy, Morocco green (the flags tell them apart)
const COLOR = { mr: 'var(--navy)', ma: 'var(--acc)' };
// scenes with `hi` (several countries): the leader in Erriwaya green, the others navy
const col = (c, s) => s && s.hi ? (c === s.hi ? 'var(--acc)' : 'var(--navy)') : COLOR[c] || 'var(--navy)';
// thousands separators, fixed decimals
const fmt = (x, d = 0) => { const [i, f] = x.toFixed(d).split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : ''); };
const decs = v => (String(v).split('.')[1] || '').length;

// flags drawn in SVG (3:2)
let fid = 0;
function flag(c, w) {
  const h = w * 2 / 3;
  if (c === 'mr') {
    const id = 'm' + (fid++);
    return `<svg class="flag" width="${w}" height="${h}" viewBox="0 0 300 200"><defs><mask id="${id}"><circle cx="150" cy="92" r="62" fill="#fff"/><circle cx="150" cy="70" r="62" fill="#000"/></mask></defs>
      <rect width="300" height="200" fill="#00A95C"/><rect width="300" height="40" fill="#D01C1F"/><rect y="160" width="300" height="40" fill="#D01C1F"/>
      <rect width="300" height="200" fill="#FFD700" mask="url(#${id})"/><path d="${star(150, 76, 22, 9)}" fill="#FFD700"/></svg>`;
  }
  const box = (inner) => `<svg class="flag" width="${w}" height="${h}" viewBox="0 0 300 200">${inner}</svg>`;
  if (c === 'dz') {
    const id = 'd' + (fid++);
    return box(`<defs><mask id="${id}"><circle cx="150" cy="100" r="50" fill="#fff"/><circle cx="163" cy="100" r="40" fill="#000"/></mask></defs>
      <rect width="300" height="200" fill="#fff"/><rect width="150" height="200" fill="#006233"/>
      <rect width="300" height="200" fill="#D21034" mask="url(#${id})"/><path d="${star(172, 100, 25, 9.6, 90)}" fill="#D21034"/>`);
  }
  if (c === 'tn') {
    const id = 't' + (fid++);
    return box(`<defs><mask id="${id}"><circle cx="150" cy="100" r="37.5" fill="#fff"/><circle cx="159.4" cy="100" r="30" fill="#000"/></mask></defs>
      <rect width="300" height="200" fill="#E70013"/><circle cx="150" cy="100" r="50" fill="#fff"/>
      <rect width="300" height="200" fill="#E70013" mask="url(#${id})"/><path d="${star(161, 100, 22.5, 8.6, 90)}" fill="#E70013"/>`);
  }
  if (c === 'ly') {
    const id = 'l' + (fid++);
    return box(`<defs><mask id="${id}"><circle cx="140" cy="100" r="25" fill="#fff"/><circle cx="147" cy="100" r="20" fill="#000"/></mask></defs>
      <rect width="300" height="200" fill="#000"/><rect width="300" height="50" fill="#E70013"/><rect y="150" width="300" height="50" fill="#239E46"/>
      <rect width="300" height="200" fill="#fff" mask="url(#${id})"/><path d="${star(170, 100, 13, 5, 90)}" fill="#fff"/>`);
  }
  const p = [0, 1, 2, 3, 4].map(k => { const a = (-90 + 72 * k) * Math.PI / 180; return [150 + 52 * Math.cos(a), 104 + 52 * Math.sin(a)]; });
  const d = [0, 2, 4, 1, 3].map((k, i) => (i ? 'L' : 'M') + p[k][0].toFixed(1) + ' ' + p[k][1].toFixed(1)).join(' ') + 'Z';
  return `<svg class="flag" width="${w}" height="${h}" viewBox="0 0 300 200"><rect width="300" height="200" fill="#C1272D"/>
    <path d="${d}" fill="none" stroke="#006233" stroke-width="9" stroke-linejoin="miter"/></svg>`;
}
function star(cx, cy, R, r, rot = -90) {
  let d = '';
  for (let k = 0; k < 10; k++) { const a = (rot + 36 * k) * Math.PI / 180, q = k % 2 ? r : R; d += (k ? 'L' : 'M') + (cx + q * Math.cos(a)).toFixed(1) + ' ' + (cy + q * Math.sin(a)).toFixed(1); }
  return d + 'Z';
}
function can(color, h) {
  return `<svg width="${h * 0.8}" height="${h}" viewBox="0 0 64 80" style="vertical-align:middle">
    <rect x="6" y="8" width="52" height="66" rx="7" fill="${color}"/><ellipse cx="32" cy="9" rx="26" ry="6" fill="${color}" opacity=".75"/>
    <ellipse cx="32" cy="9" rx="20" ry="3.4" fill="none" stroke="#fff" stroke-width="1.6" opacity=".8"/>
    <rect x="6" y="28" width="52" height="28" fill="#fff" opacity=".92"/>
    <path d="M17 42c6-7 15-7 22 0c-7 7-16 7-22 0zM39 42l8-6v12z" fill="${color}"/><circle cx="22" cy="41" r="1.6" fill="#fff"/></svg>`;
}
// tanween goes on the alef (اً): with it on the letter before (ًا) the font breaks the lam-alef ligature
const fixLa = s => s.replace(/\u064B\u0627/g, '\u0627\u064B');
const words = (s, cls = '') => fixLa(s).split(' ').map(w => `<span class="w ${cls}" data-a="word">${w}</span>`).join('<span class="w"> </span>');
const lab = (c, w = 84) => `<span class="lab">${flag(c, w)}<span class="name">${R.names[c]}</span></span>`;

let R;
const SOCIAL = [{ icons: ['site'], handle: 'ERRIWAYA.COM' }, { icons: ['facebook', 'tiktok', 'youtube'], handle: 'ERRIWAYA' }, { icons: ['instagram'], handle: 'ERRIWAYA.MR' }];
const icon = n => n === 'site' ? '<div class="ic site"><img src="../assets/site-icon.png"></div>' : `<div class="ic"><svg viewBox="0 0 24 24"><path d="${window.ICONS[n]}"/></svg></div>`;
const BUILD = {
  title: s => {
    const lines = R.titleLines || ['المغرب وموريتانيا..', 'من يصدر أسماكاً أكثر', 'ومن يجني أموالاً أكثر؟'];
    const fl = R.flags || ['ma', 'mr'], fw = fl.length > 2 ? 96 : 108, sep = '<span style="display:inline-block;width:2px;height:60px;background:var(--line);margin:0 ' + (fl.length > 2 ? 18 : 26) + 'px;vertical-align:middle"></span>';
    const top = lines.length < 3 ? 735 : 700, size = lines.length < 3 ? 104 : 80;
    return `<div class="photo dim" style="top:0;height:640px">${s.img ? `<img class="cov" src="${DIR}img/${s.img}" data-fy="${s.fy ?? 0.5}">` : '<img id="clipimg">'}</div>
    <div class="abs" style="left:0;right:0;top:600px;text-align:center" data-a="fade" data-in="0.5">${fl.map(c => flag(c, fw)).join(sep)}</div>
    <div class="tt" style="top:${top}px;font-size:${size}px">${lines.map((l, i) => words(l, i === lines.length - 1 ? 'r' : '')).join('<br>')}</div>
    <div class="sub" style="top:1085px" data-a="fade" data-in="2.0">${R.subtitle}</div>`;
  },
  hbars: s => s.rows.length > 2 ? hrows(s) : hbars2(s),
  map: s => mapScene(s),
  tiles: s => tiles(s),
  _hbars: s => {
    const max = Math.max(...s.rows.map(r => r.v)), L = W - 112, min = Math.min(...s.rows.map(r => r.v));
    return head(s) + s.rows.map((r, i) => `<div class="row" style="top:${470 + i * 240}px" data-a="fade" data-in="${0.3 + 0.25 * i}">${lab(r.c)}
        <div class="val" style="color:${COLOR[r.c]}"><span class="ltr" data-a="count" data-v="${r.v}" data-in="${0.5 + 0.25 * i}">0</span><small>${r.label}</small></div>
        <div class="bar" style="background:${COLOR[r.c]}" data-a="growx" data-w="${L * r.v / max}" data-in="${0.5 + 0.25 * i}">${s.diff && r.v === max ? `<i style="width:${L * (max - min) / max}px" data-a="fade" data-in="2.1"></i>` : ''}</div></div>`).join('') +
      `<div class="note" style="top:975px" data-a="pop" data-in="2.4">${s.note}</div>`;
  },
  vbars: s => {
    const max = Math.max(...s.cols.map(c => c.v)), Hm = 390, base = 1016, xs = [W - 56 - 330 + 50, 56 + 50];
    return head(s) + s.grid.map(g => `<div class="grid" style="top:${base - Hm * g / max}px" data-a="fade" data-in="0.3"><span class="ltr">${g}</span></div>`).join('') +
      s.cols.map((c, i) => { const h = Hm * c.v / max, x = xs[i];
        return `<div class="col" style="left:${x + 50}px;background:${COLOR[c.c]}" data-a="growy" data-h="${h}" data-in="${0.5 + 0.3 * i}"></div>
          <div class="cv" style="left:${x}px;top:${base - h - 172}px;color:${COLOR[c.c]}" data-a="fade" data-in="${1.2 + 0.3 * i}"><b class="ltr" data-a="count" data-v="${c.v}" data-in="${0.5 + 0.3 * i}">0</b><span>${c.label}</span></div>
          <div class="cl" style="left:${x}px" data-a="fade" data-in="${0.3 + 0.3 * i}">${flag(c.c, 72)}<span class="name">${R.names[c.c]}</span></div>`; }).join('') +
      `<div class="base"></div><div class="note" style="top:1116px" data-a="pop" data-in="2.4">${s.note}</div>`;
  },
  cards: s => {
    const max = Math.max(...s.cards.map(c => c.v));
    return head(s) + s.cards.map((c, i) => `<div class="card" style="${i ? 'left:56px' : 'right:56px'}" data-a="fade" data-in="${0.3 + 0.3 * i}">
        <div class="band" style="background:${COLOR[c.c]}"></div>${flag(c.c, 72)}<span class="name" style="font-size:42px">${R.names[c.c]}</span>
        <div class="dol" style="background:${COLOR[c.c]}">$</div><div class="ap">نحو</div>
        <div class="big" style="color:${COLOR[c.c]}"><span class="ltr" data-a="count" data-v="${c.v}" data-in="${0.6 + 0.3 * i}">0</span></div><div class="lb">${c.label}</div>
        <div class="track"></div><div class="mini" style="background:${COLOR[c.c]}" data-a="growx" data-w="${372 * c.v / max}" data-in="${0.9 + 0.3 * i}"></div></div>`).join('');
  },
  share: s => {
    const L = W - 112;
    return head(s) + s.rows.map((r, i) => `<div class="row" style="top:${470 + i * 220}px" data-a="fade" data-in="${0.3 + 0.25 * i}">${lab(r.c)}
        <div class="val" style="color:${COLOR[r.c]};top:-26px">${can(COLOR[r.c], 84)}<span style="font-size:36px;margin:0 12px">${r.approx ? 'نحو' : ''}</span><span class="ltr"><span data-a="count" data-v="${r.v}" data-in="${0.5 + 0.25 * i}">0</span>%</span></div>
        <div class="bar" style="background:${COLOR[r.c]}" data-a="growx" data-w="${L * r.v / s.max}" data-in="${0.5 + 0.25 * i}"></div></div>`).join('') +
      `<div class="axis" style="top:910px"></div>` + s.ticks.map(k => `<div class="tick ltr" style="top:924px;right:${56 + L * k / s.max}px">${k}%</div>`).join('') +
      `<div class="note" style="top:1030px" data-a="pop" data-in="2.4">${s.note}</div>`;
  },
  outro: s => `<div class="oc tag" data-a="fade" data-in="0.8">تابعوا الرواية</div><div class="oc rl" data-a="fade" data-in="1.0"></div>
    <div class="orows">` + SOCIAL.map(r => `<div class="orow">${r.icons.map(n => `<span data-a="pop1">${icon(n)}</span>`).join('')}<span class="h" data-a="pop1">${r.handle}</span></div>`).join('') + `</div>`,
  conclusion: s => `<div class="photo" style="top:270px;height:410px"><img class="cov" src="${DIR}img/${s.img}" data-fy="${s.fy ?? 0.5}"></div>
    <div class="big2" style="top:680px;color:var(--navy)${s.lines[0].length > 30 ? ';font-size:62px' : ''}">${flag((s.lineFlags || ['mr'])[0], 72)} ${words(s.lines[0])}</div>
    <div class="big2" style="top:785px;color:var(--acc)${s.lines[1].length > 30 ? ';font-size:62px' : ''}">${flag((s.lineFlags || [0, 'ma'])[1], 72)} ${words(s.lines[1])}</div>
    <div class="small" style="top:940px" data-a="fade" data-in="1.8">${s.small}</div>
    <div class="srcs" style="top:1085px" data-a="fade" data-in="2.3">${R.sources}</div>`,
};
const hbars2 = s => BUILD._hbars(s);
// several countries: one row each (flag, name, figure as written), bars on one scale (m), `na` rows dashed
function hrows(s) {
  const max = Math.max(...s.rows.filter(r => r.m).map(r => r.m)), L = W - 112, pitch = 148;
  return head(s) + s.rows.map((r, i) => {
    const top = 466 + i * pitch, a = 0.3 + 0.22 * i;
    if (r.na) return `<div class="hr" style="top:${top}px" data-a="fade" data-in="${a}">${lab(r.c, 66)}
        <div class="hv na">${r.na}</div><div class="htrack dash"></div></div>`;
    return `<div class="hr${r.c === s.hi ? ' hi' : ''}" style="top:${top}px" data-a="fade" data-in="${a}">${lab(r.c, 66)}
        <div class="hv" style="color:${col(r.c, s)}"><span class="ltr" data-a="count" data-v="${r.v}" data-in="${a + 0.2}">0</span><small>${r.label}</small></div>
        <div class="htrack"></div><div class="hbar" style="background:${col(r.c, s)}" data-a="growx" data-w="${Math.max(6, L * r.m / max)}" data-in="${a + 0.2}"></div></div>`;
  }).join('');
}
// map: the countries coloured by what their figure is (reserves / estimated resources / none), figures on top
function mapScene(s) {
  const M = window.MAP, X = 56, Y = 452;
  const fill = k => k === 'res' ? 'var(--acc)' : k === 'est' ? 'url(#hatch)' : '#CFC9BC';
  const svg = `<svg class="abs" style="left:${X}px;top:${Y}px" width="${M.w}" height="${M.h}" viewBox="0 0 ${M.w} ${M.h}" data-a="fade" data-in="0.1">
    <defs><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#C9D1E1"/><rect width="6" height="14" fill="#0B1F4B" opacity=".55"/></pattern></defs>
    ${M.other.map(d => `<path d="${d}" fill="#ECE9E2" stroke="#D3CEC3" stroke-width="1.2"/>`).join('')}
    <path d="${M.ws}" fill="#ECE9E2" stroke="#B9B3A6" stroke-width="1.4" stroke-dasharray="5 4"/>
    ${Object.keys(M.main).map((c, i) => `<path d="${M.main[c]}" fill="${fill(s.areas[c].kind)}" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" data-a="fade" data-in="${0.5 + 0.2 * i}"/>`).join('')}
  </svg>`;
  const labels = Object.keys(M.main).map((c, i) => {
    const A = s.areas[c], mv = (s.move || {})[c] || [0, 0], x = X + M.at[c][0] + mv[0], y = Y + M.at[c][1] + mv[1];
    const inner = A.kind === 'nd' ? `<div class="mt">${flag(c, 48)}<span>${R.names[c]}</span></div>`
      : `<div class="mt">${flag(c, 48)}<span>${R.names[c]}</span></div><div class="mv">${A.pre ? `<em>${A.pre}</em>` : ''}<span class="ltr" data-a="count" data-v="${A.v}" data-in="${1.4 + 0.35 * i}">0</span><small>${A.label}</small></div><div class="ms">${A.sub}</div>`;
    return `<div class="mlab ${A.kind}" style="left:${x}px;top:${y}px" data-a="pop" data-in="${1.2 + 0.35 * i}">${inner}</div>`;
  }).join('');
  const sw = k => k === 'res' ? 'background:var(--acc)' : k === 'est' ? 'background:repeating-linear-gradient(45deg,#0B1F4B 0 4px,#C9D1E1 4px 9px)' : 'background:#CFC9BC';
  const legend = `<div class="legend" data-a="fade" data-in="2.6">${s.legend.map(([k, t]) => `<span><i style="${sw(k)}"></i>${t}</span>`).join('')}</div>`;
  return head(s) + svg + labels + legend + `<div class="note navy" style="top:1060px;font-size:34px;padding:6px 30px 14px" data-a="pop" data-in="3.4">${s.note}</div>`;
}
// equal cards (no bars, no ranking): 3 on top, 2 below
function tiles(s) {
  const cw = 310, ch = 340, gap = 26, row = [3, 2];
  let k = 0, html = head(s);
  row.forEach((n, ri) => {
    const total = n * cw + (n - 1) * gap, x0 = (W - total) / 2;
    for (let j = 0; j < n; j++, k++) {
      const T = s.tiles[k], a = 0.3 + 0.2 * k;
      html += `<div class="tile" style="right:${x0 + j * (cw + gap)}px;top:${454 + ri * (ch + 18)}px" data-a="fade" data-in="${a}">
        <div class="band"></div><div class="tc">${flag(T.c, 54)}<span>${R.names[T.c]}</span></div>
        <div class="tv">${T.pre ? `<em>${T.pre}</em>` : ''}<span class="ltr" data-a="count" data-v="${T.v}" data-in="${a + 0.3}">0</span></div>
        <div class="tl">${T.label}</div><div class="ts">${T.sub}<br><span class="ltr">${T.year}</span></div></div>`;
    }
  });
  return html + `<div class="small" style="top:1176px;left:56px;right:56px;font-size:24px;padding:8px 16px 12px;white-space:nowrap" data-a="fade" data-in="2.2">${s.small}</div>`;
}
function head(s) {
  const ph = s.img ? ' onph' : '';
  return (s.img ? `<div class="banner"><img class="cov" src="${DIR}img/${s.img}" data-fy="${s.fy ?? 0.5}"></div>` : '') +
    `<div class="hd${ph}" data-a="fade" data-in="0"><div class="n">${s.n}</div><div class="h">${s.heading}</div></div><div class="unit${ph}" data-a="fade" data-in="0.15">${s.unit}</div>`;
}

function sceneAt(t) {
  let i = 0;
  while (i + 1 < R.scenes.length && R.scenes[i + 1].t <= t) i++;
  return { s: R.scenes[i], i, end: R.scenes[i + 1] ? R.scenes[i + 1].t : R.duration };
}

const sizes = {};
function natural(src) {
  if (sizes[src]) return Promise.resolve(sizes[src]);
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(sizes[src] = [i.naturalWidth, i.naturalHeight]); i.onerror = () => rej(new Error('missing ' + src)); i.src = src; });
}
function cover(img, wh, bw, bh, k, fy = 0.5) {
  const s = Math.max(bw / wh[0], bh / wh[1]) * k, w = wh[0] * s, h = wh[1] * s;
  Object.assign(img.style, { width: w + 'px', height: h + 'px', left: (bw - w) / 2 + 'px', top: (bh - h) * fy + 'px' });
}
let lastFrame = Infinity;

window.renderFrame = async t => {
  const { s, i, end } = sceneAt(t), dt = t - s.t, el = $('scene');
  if (el.dataset.key !== String(i)) {
    el.dataset.key = i;
    el.innerHTML = BUILD[s.type](s);
    await Promise.all([...el.querySelectorAll('img[src]')].map(im => im.decode()));
  }
  // scene in / out
  const out = s === R.scenes[R.scenes.length - 1] ? 0 : prog(t, end - 0.35, end);
  el.style.opacity = 1 - out;
  // header title from the first chart on
  const ht = $('htitle');
  if (!ht.innerHTML) ht.innerHTML = `<div class="t">${R.title.replace('.. ', '..<br>')}</div><div class="s">${R.subtitle}</div>`;
  const OUT = s.type === 'outro';
  const hq = s.type === 'title' ? prog(t, end - 0.35, end) : OUT ? 1 - prog(dt, 0, 0.35) : 1;
  ht.style.opacity = hq;
  // animated elements
  let wi = 0, pi = 0;
  el.querySelectorAll('[data-a]').forEach(e => {
    const a = +(e.dataset.in || 0), k = e.dataset.a;
    if (k === 'word') { const q = eout(prog(dt, 0.15 + 0.07 * wi, 0.55 + 0.07 * wi)); wi++; e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * 30}px)`; return; }
    if (k === 'fade') { const q = eout(prog(dt, a, a + 0.5)); e.style.opacity = q; e.style.transform = (e.classList.contains('note') ? 'translateX(-50%) ' : '') + `translateY(${(1 - q) * 26}px)`; return; }
    if (k === 'pop1') { const a1 = 1.1 + 0.18 * pi++, q = eout(prog(dt, a1, a1 + 0.35)); e.style.display = 'inline-block'; e.style.opacity = q; e.style.transform = `scale(${0.6 + 0.4 * q})`; return; }
    if (k === 'pop') { const q = eout(prog(dt, a, a + 0.45)); e.style.opacity = q; e.style.transform = `translateX(-50%) scale(${0.85 + 0.15 * q})`; return; }
    if (k === 'growx') { e.style.width = (+e.dataset.w * eio(prog(dt, a, a + 1.3))) + 'px'; return; }
    if (k === 'growy') { e.style.height = (+e.dataset.h * eio(prog(dt, a, a + 1.3))) + 'px'; return; }
    if (k === 'count') { const v = +e.dataset.v; e.textContent = fmt(v * eio(prog(dt, a, a + 1.3)), decs(e.dataset.v)); }
  });
  // title footage (played at 0.75x) and conclusion photo, both with a slow push-in
  const ci = $('clipimg');
  if (ci) {
    let n = Math.min(Math.floor(dt * FPS * 0.75) + 1, lastFrame), src, wh;
    for (;;) { src = FRAMES + s.clip + '/f' + String(n).padStart(5, '0') + '.jpg'; try { wh = await natural(src); break; } catch (e) { if (--n < 1) throw e; lastFrame = n; } }
    if (ci.getAttribute('src') !== src) { ci.setAttribute('src', src); await ci.decode(); }
    cover(ci, wh, W, 640, 1.02 + 0.06 * dt / (end - s.t));
  }
  for (const im of el.querySelectorAll('img.cov'))
    cover(im, await natural(im.src), im.parentNode.offsetWidth, im.parentNode.offsetHeight, 1.04 + 0.08 * prog(dt, 0, end - s.t), +im.dataset.fy);
  // white logo over the opening footage, navy elsewhere; the header rule waits for the charts
  $('logo').style.background = s.type === 'title' && dt < end - s.t - 0.35 ? '#fff' : 'var(--navy)';
  $('rule').style.opacity = hq;
  // outro: logo grows from the header to the centre; footer (and the story label) give way
  const lg = $('logo'), lp = OUT ? eio(prog(dt, 0, 0.9)) : 0;
  const L0 = [64, 56, 130, 176], L1 = [(W - 330) / 2, 300, 330, 447];
  ['left', 'top', 'width', 'height'].forEach((k, j) => lg.style[k] = (L0[j] + (L1[j] - L0[j]) * lp) + 'px');
  $('foot').style.opacity = OUT ? 1 - prog(dt, 0, 0.3) : 1;
  $('kicker').style.opacity = OUT ? 1 - prog(dt, 0, 0.3) : 1;
  if (FORMAT === 'youtube') {
    // left panel: the title footage, then each scene's photo; gone in the outro while the design moves to the centre
    const si = $('sideimg'), src = ci ? ci.getAttribute('src') : s.img ? DIR + 'img/' + s.img : si.getAttribute('src');
    if (src && si.getAttribute('src') !== src) { si.setAttribute('src', src); await si.decode(); }
    if (src) cover(si, await natural(si.src), 1100, 1080, 1.04 + 0.06 * prog(dt, 0, end - s.t), s.fy ?? 0.5);
    const mp = OUT ? eio(prog(dt, 0, 0.9)) : 0;
    $('side').style.opacity = 1 - mp;
    $('frame').style.transform = `translateX(${1056 - 528 * mp}px) scale(.8)`;
  }
};

(async () => {
  await load(DIR + 'graphic.js');
  R = window.GRAPHIC;
  if (R.scenes.some(s => s.type === 'map')) await load(DIR + 'map.js');
  // every text of the graphic gets the same tanween fix
  const fix = o => { for (const k in o) { if (typeof o[k] === 'string') o[k] = fixLa(o[k]); else if (o[k] && typeof o[k] === 'object') fix(o[k]); } };
  fix(R);
  window.DURATION = R.duration;
  $('foot').innerHTML = SOCIAL.map(r => `<div class="g">${r.icons.map(icon).join('')}<span class="h">${r.handle}</span></div>`).join('');
  await Promise.all([...$('foot').querySelectorAll('img')].map(i => i.decode()));
  await document.fonts.load('60px AlQuds', 'العربية');
  window.READY = true;
})();
function load(src) {
  return new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = r; document.body.appendChild(s); });
}
</script>
</body>
</html>
