name: erriwaya
description: تطبيق الرواية – أخبار وتقارير وفيديوهات.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  xml: ^6.5.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  webview_flutter: ^4.10.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: AlQuds
      fonts:
        - asset: assets/fonts/al-quds.otf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/icon.png
  adaptive_icon_background: "#004A49"
  adaptive_icon_foreground: assets/images/icon_fg.png
  min_sdk_android: 21
