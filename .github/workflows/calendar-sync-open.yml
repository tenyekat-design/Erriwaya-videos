# تشخيص توقيت الفاتحة وبداية البقرة لتلاوات القراء الموريتانيين (السجل فقط)
name: calendar-sync-open
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/calendar-android/tools/sync-open/**"
      - ".github/workflows/calendar-sync-open.yml"
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        reciter: [rajel, laghdaf, abdqader]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/calendar-android/tools
            apps/calendar-android/assets/data
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy librosa
      - run: python3 apps/calendar-android/tools/sync-open/open.py ${{ matrix.reciter }}
