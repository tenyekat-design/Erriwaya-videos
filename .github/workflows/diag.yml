name: diag
on: {push: {branches: [android-diag]}}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          MUA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          out=""
          curl -sL -A "$UA" -H 'Cookie: CONSENT=YES+1' -o d.html "https://www.youtube.com/@ERRIWAYA"
          curl -sL -A "$MUA" -H 'Cookie: CONSENT=YES+1' -o m.html "https://www.youtube.com/@ERRIWAYA"
          for f in d.html m.html; do
            a=$(grep -oE '.{40}UC[A-Za-z0-9_-]{22}' $f | head -5 | tr '\n' ' ' | tr '|' '/')
            out="$out $f size=$(wc -c <$f) :: $a |"
          done
          id=$(grep -oE 'UC[A-Za-z0-9_-]{22}' d.html | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')
          r=$(curl -sL -o rss.xml -w '%{http_code}' "https://www.youtube.com/feeds/videos.xml?channel_id=$id"); n=$(grep -c '<entry>' rss.xml); tt=$(grep -oE '<title>[^<]*' rss.xml | head -4 | tr '\n' ' '); lk=$(grep -oE 'href="[^"]*(shorts|watch)[^"]*"' rss.xml | head -3 | tr '\n' ' ')
          out="$out ID=$id RSS $r entries=$n $tt $lk |"
          for h in erriwaya erriwaya.mr ERRIWAYA; do o=$(curl -sL "https://www.tiktok.com/oembed?url=https://www.tiktok.com/@$h" | head -c 300 | tr '|' '/'); out="$out ttoembed@$h: $o |"; done
          o=$(curl -sL -A "$UA" -o fbp.html -w '%{http_code} %{url_effective}' "https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2FERRIWAYA&tabs=timeline&width=500&height=800"); t=$(grep -oE '_1drp[^<]{0,80}|<title>[^<]*' fbp.html | head -3 | tr '\n' ' '); out="$out fbplugin: $o size=$(wc -c <fbp.html) $t |"
          echo "::notice title=diag::$out"
