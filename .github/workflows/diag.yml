name: diag
on: {push: {branches: [android-diag]}}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          MUA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          ID=UCI5O5rxscjt_t1S1gSbLAEg
          mkdir -p dump
          for t in videos shorts; do
            curl -sL -A "$UA" -H 'Cookie: CONSENT=YES+1' -H 'Accept-Language: ar' -o dump/$t.html "https://www.youtube.com/channel/$ID/$t"
            curl -sL -A "$MUA" -H 'Cookie: CONSENT=YES+1' -H 'Accept-Language: ar' -o dump/m-$t.html "https://www.youtube.com/channel/$ID/$t"
          done
          gzip dump/*.html
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add dump && git commit -qm "dump [skip ci]" && git push
