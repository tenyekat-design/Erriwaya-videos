name: diag
on: {push: {branches: [android-diag]}}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          ID=UCI5O5rxscjt_t1S1gSbLAEg
          out=""
          for t in videos shorts streams; do
            curl -sL -A "$UA" -H 'Cookie: CONSENT=YES+1' -H 'Accept-Language: ar' -o $t.html "https://www.youtube.com/channel/$ID/$t"
            n=$(grep -oE '"videoId":"[A-Za-z0-9_-]{11}"' $t.html | sort -u | wc -l)
            out="$out $t: size=$(wc -c <$t.html) uniqueVideoIds=$n |"
          done
          ex=$(grep -oE '"videoRenderer":\{"videoId":"[^"]{11}".{0,700}' videos.html | head -1 | tr '|' '/')
          out="$out VR: $ex |"
          sx=$(grep -oE '"shortsLockupViewModel".{0,900}' shorts.html | head -1 | tr '|' '/')
          out="$out SL: $sx |"
          r=$(curl -sL -o r2.xml -w '%{http_code}' "https://www.youtube.com/feeds/videos.xml?playlist_id=UUI5O5rxscjt_t1S1gSbLAEg"); out="$out UUfeed $r $(grep -c '<entry>' r2.xml) |"
          about=$(grep -oE '"videoCountText":\{[^}]{0,200}|[0-9,]+ (videos|فيديو)' videos.html | head -2 | tr '|' '/'); out="$out count: $about |"
          echo "::notice title=diag::$out"
