name: diag
on: {push: {branches: [android-diag]}}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          K=AIzaSyBAPju15XYiYBEq7_AKVzqdd6KpVvH6Orc
          r=$(curl -s "https://firestore.googleapis.com/v1/projects/erriwaya-68022/databases/(default)/documents/articles?key=$K" | head -c 400 | tr '\n|' '  ')
          w=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"fields":{"title":{"stringValue":"x"}}}' "https://firestore.googleapis.com/v1/projects/erriwaya-68022/databases/(default)/documents/articles?key=$K" | head -c 300 | tr '\n|' '  ')
          a=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"email":"probe@example.com","password":"x"}' "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$K" | head -c 300 | tr '\n|' '  ')
          echo "::notice title=diag::READ: $r | ANON-WRITE: $w | AUTH: $a"
