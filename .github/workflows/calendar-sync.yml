# توقيت آيات تلاوات القراء الموريتانيين لتطبيق «التقويم الموريتاني»: يُنقل من ستة تسجيلات لها توقيت بمطابقة الصوت
# (apps/calendar-android/tools/sync/run.py)، ثم يُكتب في assets/data/tm-m-<القارئ>.js ويُبنى التطبيق من جديد.
name: calendar-sync
on:
  workflow_dispatch:
    inputs:
      reciters:
        description: 'JSON list of the reciters to time, e.g. ["rajel"]'
        default: '["rajel","rabbani","laghdaf","naji","abdqader"]'
  push:
    paths:
      - "apps/calendar-android/tools/sync/**"
      - ".github/workflows/calendar-sync.yml"
permissions:
  contents: write
  actions: write
concurrency: calendar-sync-${{ github.ref }}
jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        reciter: ${{ fromJSON(inputs.reciters || '["rajel","rabbani","laghdaf","naji","abdqader"]') }}
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/calendar-android/tools/sync
            apps/calendar-android/assets/data
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy librosa
      - name: Carry the verse timings over
        run: |
          python3 apps/calendar-android/tools/sync/run.py ${{ matrix.reciter }} tm-m-${{ matrix.reciter }}-${{ matrix.part }}.json ${{ matrix.part }} 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tm-m-${{ matrix.reciter }}-${{ matrix.part }}
          path: tm-m-${{ matrix.reciter }}-${{ matrix.part }}.json
  commit:
    needs: time
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/calendar-android/assets/data
            apps/calendar-android/tools/sync-test
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Write the data files and commit
        run: |
          python3 - <<'PY'
          import json,glob,re,collections
          T=collections.defaultdict(lambda:[None]*114);S=collections.defaultdict(lambda:[None]*114)
          for f in glob.glob('out/*/tm-m-*.json'):
              rid=re.search(r'tm-m-([a-z]+)-\d+\.json$',f).group(1);d=json.load(open(f))
              for i in range(114):
                  if d['spread'][i] is not None:S[rid][i]=d['spread'][i]
                  if d['t'][i]:T[rid][i]=d['t'][i]
          for rid in S:
              open(f'apps/calendar-android/assets/data/tm-m-{rid}.js','w').write(f'DATA_LOADED("tm-m-{rid}",'+json.dumps(T[rid],separators=(',',':'))+');\n')
              print(rid,sum(1 for x in T[rid] if x),'suras kept; no file:',[i+1 for i,x in enumerate(S[rid]) if x is None],'dropped:',[(i+1,x) for i,x in enumerate(S[rid]) if x is not None and x<0.5],'agreed share by sura:',S[rid])
          import os;LR='apps/calendar-android/tools/sync-test/last-run.json'
          old=json.load(open(LR)) if os.path.exists(LR) else {};old.update(S)   # keep the reciters not timed in this run
          json.dump(old,open(LR,'w'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/calendar-android/assets/data/tm-m-*.js apps/calendar-android/tools/sync-test/last-run.json
          git diff --cached --quiet || git commit -m "Calendar app: verse timings of the Mauritanian recordings (calendar-sync run ${{ github.run_number }})"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Rebuild the app with the new timings (a push by this token does not start the APK workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run calendar-android.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}"
