name: Build Erriwaya APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          set -o pipefail
          flutter --version | tee -a build.log
          cp -r lib /tmp/lib-backup
          flutter create --platforms=android --org mr.erriwaya --project-name erriwaya . 2>&1 | tail -5 | tee -a build.log
          rm -rf lib && cp -r /tmp/lib-backup lib
          rm -rf test
          python3 android-ci/patch_android.py . | tee -a build.log
          mkdir -p ~/.android && cp android-ci/debug.keystore ~/.android/debug.keystore

      - name: Dependencies and icons
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a build.log
          dart run flutter_launcher_icons 2>&1 | tee -a build.log

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee -a build.log || { sleep 60; flutter build apk --release --split-per-abi 2>&1 | tee -a build.log; }
          O=build/app/outputs/flutter-apk
          cp $O/app-arm64-v8a-release.apk erriwaya.apk
          cp $O/app-armeabi-v7a-release.apk erriwaya-old-phones.apk
          cp $O/app-x86_64-release.apk erriwaya-x86_64.apk
          ls -la *.apk

      - name: Report errors
        if: failure()
        run: |
          python3 - <<'EOF'
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          keys = ('error', 'Error', 'FAILURE', 'failed', 'Because', 'version solving', 'What went wrong', 'Could not', 'Exception')
          picked = [l for l in lines if any(k in l for k in keys)][:120]
          tail = lines[-60:]
          def emit(title, chunk):
              msg = '\n'.join(chunk).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={title}::{msg}')
          for i in range(0, len(picked), 30):
              emit(f'errors-{i//30}', picked[i:i+30])
          emit('tail', tail)
          EOF

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: erriwaya-apk
          path: erriwaya-x86_64.apk

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: تطبيق الرواية – نسخة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            erriwaya.apk
            erriwaya-old-phones.apk
          make_latest: true
          body: |
            ملف تثبيت تطبيق الرواية لأندرويد.
            حمّل erriwaya.apk (لمعظم الهواتف) أو erriwaya-old-phones.apk (للهواتف القديمة) وافتحه على الهاتف (اسمح بالتثبيت من مصادر غير معروفة عند الطلب).

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: erriwaya-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android-ci/shots.sh
      - name: Attach screenshots to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          files: |
            shots/*.png
            shots/flutter-log.txt
