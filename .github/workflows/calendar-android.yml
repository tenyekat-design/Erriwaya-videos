# يبني تطبيق أندرويد «التقويم الموريتاني» (apps/calendar-android) ويضع ملف APK في الفرع نفسه.
name: calendar-android
on:
  push:
    paths:
      - "apps/calendar-android/**"
      - "!apps/calendar-android/dist/**"
      - ".github/workflows/calendar-android.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency: calendar-android-${{ github.ref }}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check the app's prayer times against the page's
        run: apps/calendar-android/tools/check-prayer-calc.sh
      - name: Build APK
        run: apps/calendar-android/build.sh
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
          KEYSTORE_PASS: ${{ secrets.CALENDAR_KEYSTORE_PASS }}
          KEYSTORE_ALT: ${{ secrets.CALENDAR_KEYSTORE_B64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: mauritania-calendar-apk
          path: apps/calendar-android/dist/mauritania-calendar.apk
      - name: Commit the APK to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/calendar-android/dist/mauritania-calendar.apk
          git diff --cached --quiet || git commit -m "Build calendar APK (run ${{ github.run_number }})"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
