# One-off check of the subscription notice settings (prints only whether they are set, never their values).
name: sub-check
on:
  push:
    branches: [geo-sources]
    paths: [".github/workflows/sub-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          FS=https://firestore.googleapis.com/v1/projects/erriwaya-68022/databases/\(default\)/documents
          curl -s "$FS/sub_config/tg" > tg.json
          python3 - <<'P'
          import json,urllib.request
          d=json.load(open('tg.json'));f=d.get('fields',{})
          print('tg doc:', 'error' in d and d['error'].get('status'), 'fields:', sorted(f))
          tok=f.get('tgToken',{}).get('stringValue','');chat=f.get('tgChat',{}).get('stringValue','')
          print('token set:',bool(tok),'chat set:',bool(chat))
          if tok:
              try:
                  r=json.load(urllib.request.urlopen('https://api.telegram.org/bot'+tok+'/getMe',timeout=20));print('getMe ok:',r.get('ok'),'bot:',r.get('result',{}).get('username'))
              except Exception as e: print('getMe failed:',type(e).__name__, getattr(e,'code',''))
              if chat:
                  try:
                      r=json.load(urllib.request.urlopen('https://api.telegram.org/bot'+tok+'/getChat?chat_id='+chat,timeout=20));print('getChat ok:',r.get('ok'),'type:',r.get('result',{}).get('type'))
                  except Exception as e: print('getChat failed:',type(e).__name__, getattr(e,'code',''))
          P
          curl -s "$FS/sub_config/public" | python3 -c "import json,sys;d=json.load(sys.stdin);print('public fields:',sorted(d.get('fields',{})) or d.get('error',{}).get('status'))"
