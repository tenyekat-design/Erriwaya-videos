# One-off test: can an app write a subscription request (sub_requests/TESTCLAUDE) under the live rules?
name: sub-check
on:
  push:
    branches: [geo-sources]
    paths: [".github/workflows/sub-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B='https://firestore.googleapis.com/v1/projects/erriwaya-68022/databases/(default)'
          body='{"writes":[{"update":{"name":"projects/erriwaya-68022/databases/(default)/documents/sub_requests/TESTCLAUDE","fields":{"id":{"stringValue":"TESTCLAUDE"},"app":{"stringValue":"bankily"},"phone":{"stringValue":"00000000"},"ref":{"stringValue":"test"},"status":{"stringValue":"new"}}},"updateTransforms":[{"fieldPath":"t","setToServerValue":"REQUEST_TIME"}]}]}'
          echo "one: $(curl -s -o /tmp/r1 -w '%{http_code}' -H 'Content-Type: application/json' -X POST "$B/documents:commit" -d "$body")"; head -c 400 /tmp/r1; echo
          body2='{"writes":[{"update":{"name":"projects/erriwaya-68022/databases/(default)/documents/sub_moves/TESTCLAUDE","fields":{"id":{"stringValue":"TESTCLAUDE"},"phone":{"stringValue":"00000000"},"status":{"stringValue":"new"}}},"updateTransforms":[{"fieldPath":"t","setToServerValue":"REQUEST_TIME"}]}]}'
          echo "move: $(curl -s -o /tmp/r2 -w '%{http_code}' -H 'Content-Type: application/json' -X POST "$B/documents:commit" -d "$body2")"; head -c 400 /tmp/r2; echo
