# موقع الرواية: يبني البيانات (يوتيوب + الأخبار) وينشر الموقع في فرع gh-pages (GitHub Pages).
# يعمل عند كل تعديل على فرع website، ويدوياً، وكل نصف ساعة عبر website-refresh.yml في الفرع الافتراضي.
name: website

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website

      - name: Assemble site
        run: |
          mkdir -p _site
          { printf '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'; cat index.html; } > _site/index.html
          cp -r assets _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
          printf 'User-agent: *\nAllow: /\n\nSitemap: https://erriwaya.com/sitemap.xml\n' > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://erriwaya.com/</loc><lastmod>%s</lastmod><changefreq>hourly</changefreq><priority>1.0</priority></url>\n</urlset>\n' "$(date -u +%FT%TZ)" > _site/sitemap.xml

      - name: Fetch videos and news
        run: python3 scripts/build_data.py _site

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "erriwaya-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "site $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
