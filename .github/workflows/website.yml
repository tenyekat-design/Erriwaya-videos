# موقع الرواية: يبني البيانات (يوتيوب + الأخبار) وينشر الموقع على GitHub Pages.
# يعمل عند كل تعديل على فرع website، ويدوياً، وكل نصف ساعة عبر website-refresh.yml في الفرع الافتراضي.
name: website

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website

      - name: Assemble site
        run: |
          mkdir -p _site
          { printf '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'; cat index.html; } > _site/index.html
          cp -r assets _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll

      - name: Fetch videos and news
        run: python3 scripts/build_data.py _site

      - name: Save data snapshot (branch website-data)
        run: |
          cd _site
          git init -q -b website-data
          git config user.name "erriwaya-bot"
          git config user.email "actions@github.com"
          git add data.json img 2>/dev/null || git add data.json
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" website-data
          rm -rf .git

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
