# Fetches the open place gazetteers of Mauritania (GeoNames, OpenStreetMap) into geo-sources/ on this branch.
name: geo-sources
on:
  push:
    branches: [geo-sources]
    paths: [".github/workflows/geo-sources.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -x
          mkdir -p geo-sources && cd geo-sources
          git clone -q --depth 1 https://github.com/open-admin-data/mauritania-administrative-divisions oad
          find oad -type f -not -path '*/.git/*' | xargs ls -la
          mkdir -p admin && find oad -type f \( -iname '*.geojson' -o -iname '*.json' -o -iname '*.csv' \) -size -40M -not -path '*/.git/*' -exec cp {} admin/ \;
          rm -rf oad
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f geo-sources
          git commit -m "Geo sources $(date -u +%FT%H:%MZ)" && git push || true
