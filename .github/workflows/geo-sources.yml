# Fetches the open place gazetteers of Mauritania (GeoNames, OpenStreetMap) into geo-sources/ on this branch.
name: geo-sources
on:
  push:
    branches: [geo-sources]
    paths: [".github/workflows/geo-sources.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -x
          mkdir -p geo-sources && cd geo-sources
          sudo apt-get install -y -q osmium-tool >/dev/null
          curl -fsSL -A "erriwaya-calendar/1.0" -o mr.osm.pbf https://download.geofabrik.de/africa/mauritania-latest.osm.pbf
          osmium tags-filter mr.osm.pbf r/ISO3166-1=MR -o b.pbf
          osmium export b.pbf -f geojson --geometry-types=polygon -o mr-boundary.geojson
          ls -la mr-boundary.geojson; rm mr.osm.pbf b.pbf
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f geo-sources
          git commit -m "Geo sources $(date -u +%FT%H:%MZ)" && git push || true
